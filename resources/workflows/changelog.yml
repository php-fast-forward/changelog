# Copy to the consumer's .github/workflows/changelog.yml.
# Uses release v0.1.0; review a new version before updating this reference.
name: Changelog

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, closed]

  push:
    branches: [main]

  workflow_dispatch:

permissions: {}

jobs:
  changelog:
    permissions:
      contents: write
      pull-requests: write
      issues: read
      statuses: write

    uses: php-fast-forward/changelog/.github/workflows/changelog.yml@v0.1.0

    with:
      base-branch: main
      source: tags
      comment-mode: always
      prepare-release: true
      publish: false
