# Copy to the consumer's .github/workflows/changelog.yml.
# Uses a reviewed, integrated product commit; update deliberately after validation.
name: Changelog

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, closed]

  push:
    branches: [main]

  workflow_dispatch:

permissions: {}

jobs:
  changelog:
    permissions:
      contents: write
      pull-requests: write
      issues: read
      statuses: write

    uses: php-fast-forward/changelog/.github/workflows/changelog.yml@2a41bb8c2f0fb45d8fa6da4d7dc7abf2e4b40121

    with:
      runs-on: ${{ vars.CI_LINUX_RUNNER || '["ubuntu-latest"]' }}
      base-branch: main
      source: tags
      comment-mode: always
      prepare-release: true
      publish: false
