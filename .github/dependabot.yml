version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      composer-production:
        dependency-type: production
        patterns:
          - "*"
      composer-development:
        dependency-type: development
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-images:
        patterns:
          - "*"
    ignore:
      - dependency-name: php
        update-types:
          - version-update:semver-major
