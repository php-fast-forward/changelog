---
name: Tests

"on":
    pull_request:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read
    actions: read

concurrency:
    group: tests-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    tests:
        name: PHP 8.5 (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]

        steps:
            - name: Check out repository
              # v7
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false

            - name: Set up PHP
              # 2.36.0
              uses: shivammathur/setup-php@db91e1a0e48e84637d325a7ee4d2677e146ceec4
              with:
                  php-version: '8.5'
                  coverage: xdebug
                  tools: composer:v2

            - name: Validate Composer metadata
              run: composer validate --strict

            - name: Install development dependencies
              run: composer install --no-interaction --prefer-dist --no-plugins --no-scripts

            - name: Run the package quality and unit coverage gates
              run: composer check
              env:
                  XDEBUG_MODE: coverage

            - name: Verify canonical skill and adapter synchronization
              run: |
                  node --test scripts/skills-sync.test.mjs
                  node scripts/skills-sync.mjs --check

            - name: Smoke test the CLI
              run: php bin/changelog list --raw

            - name: Upload native line coverage from this run
              if: >-
                  ${{ success() && matrix.os == 'ubuntu-latest' &&
                      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
                       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
              # v7
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: coverage-report-php
                  path: .build/coverage.xml
                  if-no-files-found: error
                  retention-days: 30

    coverage-report:
        name: Line coverage report
        needs: tests
        if: >-
            ${{ needs.tests.result == 'success' &&
                ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
                 (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
            actions: read
            pull-requests: write
        steps:
            - name: Check out report templates
              # v7; same-repository PRs and the maintained base only.
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false

            - name: Download native coverage from this workflow run
              # v8.0.1
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
              with:
                  name: coverage-report-php
                  path: .build

            - name: Compare and summarize line coverage
              id: coverage
              # v7; follows the native Cobertura report pattern from mentordosnerds/cli.
              uses: clearlyip/code-coverage-report-action@110af9d4ec87b6706f182fd90e3102af9e5203bf
              with:
                  filename: .build/coverage.xml
                  artifact_download_workflow_names: Tests
                  artifact_name: changelog-coverage-%name%
                  overall_coverage_fail_threshold: '100'
                  file_coverage_error_min: '100'
                  file_coverage_warning_max: '100'
                  only_list_changed_files: 'true'
                  fail_on_negative_difference: 'true'
                  without_base_coverage_template: .github/coverage-templates/without-base-coverage.hbs
                  with_base_coverage_template: .github/coverage-templates/with-base-coverage.hbs

            - name: Update the sticky coverage comment
              if: >-
                  ${{ github.event_name == 'pull_request' &&
                      github.event.pull_request.head.repo.full_name == github.repository &&
                      github.event.pull_request.user.login != 'dependabot[bot]' &&
                      steps.coverage.outputs.file != '' }}
              # v2.9.4; Dependabot's restricted token still gets the report artifact.
              uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405
              with:
                  header: code-coverage-overview
                  number: ${{ github.event.pull_request.number }}
                  path: ${{ steps.coverage.outputs.file }}
