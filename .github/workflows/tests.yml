---
name: Tests

"on":
    pull_request:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: tests-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    tests:
        name: PHP 8.5 (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]

        steps:
            - name: Check out repository
              # v7
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false

            - name: Set up PHP
              # 2.36.0
              uses: shivammathur/setup-php@db91e1a0e48e84637d325a7ee4d2677e146ceec4
              with:
                  php-version: '8.5'
                  coverage: xdebug
                  tools: composer:v2

            - name: Validate Composer metadata
              run: composer validate --strict

            - name: Install development dependencies
              run: composer install --no-interaction --prefer-dist --no-plugins --no-scripts

            - name: Run the package quality and unit coverage gates
              run: composer check
              env:
                  XDEBUG_MODE: coverage

            - name: Smoke test the CLI
              run: php bin/changelog list --raw
