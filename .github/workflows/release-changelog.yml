name: Release Changelog

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: changelog-${{ github.repository }}-main
  cancel-in-progress: false

jobs:
  version:
    name: Prepare Version PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:

      - name: Check Out The Fresh Release Base
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare The Base Image Cache
        uses: ./.github/actions/setup-docker

      - name: Create Or Update The Single Version PR
        uses: ./.github/actions/version
        with:
          working-directory: '.'
          repository: ${{ github.repository }}
          token: ${{ secrets.CHANGELOG_TOKEN || github.token }}
          base-branch: main
          managed-branch: changelog/version
          automation-actor: ${{ vars.CHANGELOG_AUTOMATION_ACTOR || 'github-actions[bot]' }}
          title: 'chore: update changelog'
