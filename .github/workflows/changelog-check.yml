# The caller MUST pin this reusable workflow to a reviewed full commit SHA.
name: Changelog check

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'Consumer-relative directory below the project checkout.'
        type: string
        required: false
        default: '.'
      fragment-directory:
        description: 'Consumer-relative fragment directory.'
        type: string
        required: false
        default: '.changelog'
      changelog-file:
        description: 'Consumer-relative central changelog path.'
        type: string
        required: false
        default: 'CHANGELOG.md'
      locale:
        description: 'Built-in presentation locale en or pt-BR.'
        type: string
        required: false
        default: 'en'
      template:
        description: 'Built-in keep-a-changelog template; PHP templates are refused for PR checks.'
        type: string
        required: false
        default: 'keep-a-changelog'
      base-ref:
        description: 'Selected local base revision; automation normally uses HEAD.'
        type: string
        required: false
        default: 'HEAD'
      tag-prefix:
        description: 'Exact stable-version tag prefix.'
        type: string
        required: false
        default: 'v'
      repository:
        description: 'Target owner/name; empty uses the caller repository.'
        type: string
        required: false
        default: ''
      source:
        description: 'Historical release notes source auto, github or tags.'
        type: string
        required: false
        default: 'auto'
      pull-request:
        description: 'Live pull-request number, bound to its supplied head.'
        type: number
        required: true
      head-sha:
        description: 'Exact PR head SHA for a read-only checkout.'
        type: string
        required: true
      base-sha:
        description: 'Exact PR base SHA used for fragment/change comparison.'
        type: string
        required: true
      managed-branch:
        description: 'Exclusive generated version branch.'
        type: string
        required: false
        default: 'changelog/version'
      automation-actor:
        description: 'Configured trusted generated-PR Bot.'
        type: string
        required: false
        default: 'github-actions[bot]'
      waiver-label:
        description: 'Label requiring the latest privileged human grant.'
        type: string
        required: false
        default: 'changelog-not-required'
      maintenance-label:
        description: 'Label requiring the latest privileged human grant.'
        type: string
        required: false
        default: 'changelog-maintenance'
    secrets:
      token:
        description: 'Optional scoped App token; otherwise uses github.token.'
        required: false
    outputs:
      result:
        description: 'Complete machine-readable operation result.'
        value: ${{ jobs.changelog.outputs.result }}
      status:
        description: 'Operation status output.'
        value: ${{ jobs.changelog.outputs.status }}
      fragments:
        description: 'Operation fragments output.'
        value: ${{ jobs.changelog.outputs.fragments }}

permissions: {}

jobs:
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      result: ${{ steps.operation.outputs.result }}
      status: ${{ steps.operation.outputs.status }}
      fragments: ${{ steps.operation.outputs.fragments }}
    steps:
      # Dynamic typing preserves new official job.workflow_* fields in older actionlint schemas.
      - name: Validate the trusted workflow and consumer path
        shell: bash
        env:
          FF_RUNTIME_REPOSITORY: ${{ fromJSON(toJSON(job)).workflow_repository }}
          FF_RUNTIME_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
          FF_WORKING_DIRECTORY: ${{ inputs.working-directory }}
          FF_EVENT_NAME: ${{ github.event_name }}
          FF_TEMPLATE: ${{ inputs.template }}
          FF_HEAD_SHA: ${{ inputs.head-sha }}
          FF_BASE_SHA: ${{ inputs.base-sha }}
          FF_PR_NUMBER: ${{ inputs.pull-request }}
          FF_EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          FF_EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          FF_EVENT_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ -z "$FF_RUNTIME_REPOSITORY" || ! "$FF_RUNTIME_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::The called workflow identity is unavailable; a trusted immutable runtime is required."
            exit 1
          fi
          if [[ -z "$FF_WORKING_DIRECTORY" || "$FF_WORKING_DIRECTORY" == /* || "$FF_WORKING_DIRECTORY" =~ (^|/)\.\.(/|$) ]]; then
            echo "::error::working-directory must stay below the consumer project checkout."
            exit 1
          fi
          if [[ "$FF_WORKING_DIRECTORY" != . ]]; then
            echo "::error::GitHub PR operations require working-directory '.'. Prefix fragment-directory and changelog-file with the package path in monorepos."
            exit 1
          fi
          if [[ "$FF_EVENT_NAME" != pull_request || "$FF_PR_NUMBER" != "$FF_EVENT_PR" || "$FF_HEAD_SHA" != "$FF_EVENT_HEAD" || "$FF_BASE_SHA" != "$FF_EVENT_BASE" ]]; then
            echo "::error::Check requires the exact PR/head/base snapshot from a read-only pull_request event."
            exit 1
          fi
          if [[ "$FF_TEMPLATE" != keep-a-changelog ]]; then
            echo "::error::PR checks accept the built-in template only; PHP templates are not executed."
            exit 1
          fi
      - name: Check out consumer data
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.head-sha }}
          token: ${{ secrets.token || github.token }}
          path: project
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the called workflow runtime
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          path: .changelog-runtime
          fetch-depth: 1
          persist-credentials: false
      - name: Run the shared check action
        id: operation
        uses: ./.changelog-runtime/.github/actions/check
        with:
          working-directory: project/${{ inputs.working-directory }}
          fragment-directory: ${{ inputs.fragment-directory }}
          changelog-file: ${{ inputs.changelog-file }}
          locale: ${{ inputs.locale }}
          template: ${{ inputs.template }}
          base-ref: ${{ inputs.base-ref }}
          tag-prefix: ${{ inputs.tag-prefix }}
          repository: ${{ inputs.repository || github.repository }}
          source: ${{ inputs.source }}
          token: ${{ secrets.token || github.token }}
          pull-request: ${{ inputs.pull-request }}
          since: ${{ inputs.base-sha }}
          managed-branch: ${{ inputs.managed-branch }}
          automation-actor: ${{ inputs.automation-actor }}
          waiver-label: ${{ inputs.waiver-label }}
          maintenance-label: ${{ inputs.maintenance-label }}
