# The caller MUST pin this reusable workflow to a reviewed full commit SHA.
name: Changelog version

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'Consumer-relative directory below the project checkout.'
        type: string
        required: false
        default: '.'
      fragment-directory:
        description: 'Consumer-relative fragment directory.'
        type: string
        required: false
        default: '.changelog'
      changelog-file:
        description: 'Consumer-relative central changelog path.'
        type: string
        required: false
        default: 'CHANGELOG.md'
      locale:
        description: 'Built-in presentation locale en or pt-BR.'
        type: string
        required: false
        default: 'en'
      template:
        description: 'Built-in template or explicit trusted base PHP template.'
        type: string
        required: false
        default: 'keep-a-changelog'
      base-ref:
        description: 'Selected local base revision; automation normally uses HEAD.'
        type: string
        required: false
        default: 'HEAD'
      tag-prefix:
        description: 'Exact stable-version tag prefix.'
        type: string
        required: false
        default: 'v'
      repository:
        description: 'Target owner/name; empty uses the caller repository.'
        type: string
        required: false
        default: ''
      source:
        description: 'Historical release notes source auto, github or tags.'
        type: string
        required: false
        default: 'auto'
      base-branch:
        description: 'Fresh approved base branch to check out.'
        type: string
        required: false
        default: 'main'
      managed-branch:
        description: 'Exclusive generated version branch.'
        type: string
        required: false
        default: 'changelog/version'
      automation-actor:
        description: 'Actual authenticated App/Bot that signs generated commits.'
        type: string
        required: false
        default: 'github-actions[bot]'
      title:
        description: 'Single-line generated PR title.'
        type: string
        required: false
        default: 'chore: update changelog'
      dry-run:
        description: 'Preview the trusted transaction without writes.'
        type: boolean
        required: false
        default: false
    secrets:
      token:
        description: 'Optional scoped App token; otherwise uses github.token.'
        required: false
    outputs:
      result:
        description: 'Complete machine-readable operation result.'
        value: ${{ jobs.changelog.outputs.result }}
      status:
        description: 'Operation status output.'
        value: ${{ jobs.changelog.outputs.status }}
      version:
        description: 'Operation version output.'
        value: ${{ jobs.changelog.outputs.version }}
      pull-request:
        description: 'Operation pull-request output.'
        value: ${{ jobs.changelog.outputs.pull-request }}
      url:
        description: 'Operation url output.'
        value: ${{ jobs.changelog.outputs.url }}
      head-sha:
        description: 'Operation head-sha output.'
        value: ${{ jobs.changelog.outputs.head-sha }}
      plan-id:
        description: 'Operation plan-id output.'
        value: ${{ jobs.changelog.outputs.plan-id }}
      maintenance:
        description: 'Operation maintenance output.'
        value: ${{ jobs.changelog.outputs.maintenance }}

permissions: {}

jobs:
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: read
    concurrency:
      group: changelog-${{ inputs.repository || github.repository }}-${{ inputs.base-branch }}
      cancel-in-progress: false
    outputs:
      result: ${{ steps.operation.outputs.result }}
      status: ${{ steps.operation.outputs.status }}
      version: ${{ steps.operation.outputs.version }}
      pull-request: ${{ steps.operation.outputs.pull-request }}
      url: ${{ steps.operation.outputs.url }}
      head-sha: ${{ steps.operation.outputs.head-sha }}
      plan-id: ${{ steps.operation.outputs.plan-id }}
      maintenance: ${{ steps.operation.outputs.maintenance }}
    steps:
      # Dynamic typing preserves new official job.workflow_* fields in older actionlint schemas.
      - name: Validate the trusted workflow and consumer path
        shell: bash
        env:
          FF_RUNTIME_REPOSITORY: ${{ fromJSON(toJSON(job)).workflow_repository }}
          FF_RUNTIME_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
          FF_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail

          if [[ -z "$FF_RUNTIME_REPOSITORY" || ! "$FF_RUNTIME_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::The called workflow identity is unavailable; a trusted immutable runtime is required."
            exit 1
          fi

          if [[ -z "$FF_WORKING_DIRECTORY" \
              || "$FF_WORKING_DIRECTORY" == /* \
              || "$FF_WORKING_DIRECTORY" =~ (^|/)\.\.(/|$) \
          ]]; then
            echo "::error::working-directory must stay below the consumer project checkout."
            exit 1
          fi

          if [[ "$FF_WORKING_DIRECTORY" != . ]]; then
            echo "::error::GitHub PR operations require working-directory '.'. Prefix fragment-directory and changelog-file with the package path in monorepos."
            exit 1
          fi
      - name: Check out consumer data
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.base-branch }}
          token: ${{ secrets.token || github.token }}
          path: project
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the called workflow runtime
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          path: .changelog-runtime
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare the trusted runtime base image cache
        uses: ./.changelog-runtime/.github/actions/setup-docker
        with:
          dockerfile: .changelog-runtime/Dockerfile

      - name: Run the shared version action
        id: operation
        uses: ./.changelog-runtime/.github/actions/version
        with:
          working-directory: project/${{ inputs.working-directory }}
          fragment-directory: ${{ inputs.fragment-directory }}
          changelog-file: ${{ inputs.changelog-file }}
          locale: ${{ inputs.locale }}
          template: ${{ inputs.template }}
          base-ref: ${{ inputs.base-ref }}
          tag-prefix: ${{ inputs.tag-prefix }}
          repository: ${{ inputs.repository || github.repository }}
          source: ${{ inputs.source }}
          token: ${{ secrets.token || github.token }}
          base-branch: ${{ inputs.base-branch }}
          managed-branch: ${{ inputs.managed-branch }}
          automation-actor: ${{ inputs.automation-actor }}
          title: ${{ inputs.title }}
          dry-run: ${{ inputs.dry-run }}
