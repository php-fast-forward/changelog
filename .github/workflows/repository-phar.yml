name: 'Repository: PHAR Qualification'

on:
  workflow_dispatch:
  pull_request:
    paths:
      - bin/**
      - src/**
      - resources/**
      - composer.json
      - composer.lock
      - box.json
      - stub.php
      - tests/Phar/**
      - .github/workflows/repository-phar.yml

permissions:
  contents: read

jobs:
  phar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.5'
          extensions: curl, iconv, mbstring, phar, zlib
          tools: composer:v2, box:4.7.1
          coverage: none
      - name: Install locked runtime dependencies only
        env:
          COMPOSER_ROOT_VERSION: dev-main
        run: |
          composer install --no-dev --no-plugins --no-scripts --prefer-dist --classmap-authoritative --no-interaction --no-progress
          composer check-platform-reqs --no-dev
      - name: Build and verify the exact artifact
        run: |
          box validate --ignore-recommendations-and-warnings box.json
          box compile --no-parallel --sort-compiled-files --config=box.json
          box verify dist/changelog
          php tests/Phar/verify.php
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: changelog-phar-${{ github.sha }}
          path: dist/changelog
          if-no-files-found: error
