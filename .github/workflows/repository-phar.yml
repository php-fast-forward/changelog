name: 'Repository: PHAR Qualification'

on:
  workflow_dispatch:
  pull_request:
    paths:
      - bin/**
      - src/**
      - resources/**
      - composer.json
      - composer.lock
      - box.json
      - stub.php
      - tests/Phar/**
      - .github/workflows/repository-phar.yml

permissions:
  contents: read

jobs:
  phar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.5'
          extensions: curl, iconv, mbstring, phar, zlib
          tools: composer:2.10.3
          coverage: none
      - name: Install locked runtime dependencies only
        env:
          COMPOSER_ROOT_VERSION: dev-main
        run: |
          composer install --no-dev --no-plugins --no-scripts --prefer-dist --classmap-authoritative --no-interaction --no-progress
          composer check-platform-reqs --no-dev
      - name: Download isolated Box 4.7.1
        run: |
          curl --fail --location --silent --show-error https://github.com/box-project/box/releases/download/4.7.1/box.phar -o "$RUNNER_TEMP/box.phar"
          echo "aedabb38bad96a90868603f118956c3faa662b545c06be66df1b145aba703c0a  $RUNNER_TEMP/box.phar" | sha256sum --check
      - name: Build and verify the exact artifact
        run: |
          php "$RUNNER_TEMP/box.phar" validate --ignore-recommendations-and-warnings box.json
          php -d phar.readonly=0 "$RUNNER_TEMP/box.phar" compile --no-restart --no-parallel -c box.json
          php "$RUNNER_TEMP/box.phar" verify dist/changelog
          php tests/Phar/verify.php
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: changelog-phar-${{ github.sha }}
          path: dist/changelog
          if-no-files-found: error
