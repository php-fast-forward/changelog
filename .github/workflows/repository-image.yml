name: 'Repository: Publish Docker CLI'

on:
  workflow_call:
    inputs:

      tag:
        description: 'Verified existing release tag.'
        type: string
        required: true

      expected-sha:
        description: 'Exact approved release commit.'
        type: string
        required: true

permissions: {}

concurrency:
  group: docker-cli-${{ github.repository }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Release Image (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false

      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      image: ${{ steps.release.outputs.image }}
      sha: ${{ steps.source.outputs.sha }}
    steps:

      - name: Validate The Release Selector
        id: release
        shell: bash
        env:
          FF_TAG: ${{ inputs.tag || github.ref_name }}
          FF_EXPECTED_SHA: ${{ inputs.expected-sha || '' }}
        run: |
          set -euo pipefail

          if [[ ! "$FF_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Select an existing semantic release tag such as v1.0.0."
            exit 1
          fi

          if [[ ! "$FF_EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::The approved source must be a complete commit SHA."
            exit 1
          fi

          FF_VERSION="${FF_TAG#v}"
          if (( ${#FF_VERSION} > 128 )); then
            echo "::error::The version exceeds the container tag limit."
            exit 1
          fi

          printf 'tag=%s\nversion=%s\nimage=ghcr.io/%s\n' "$FF_TAG" "$FF_VERSION" "${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Check Out The Release Tag
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind The Tag To The Checked-Out Release Commit
        id: source
        shell: bash
        env:
          FF_TAG: ${{ steps.release.outputs.tag }}
          FF_EXPECTED_SHA: ${{ inputs.expected-sha || '' }}
        run: |
          set -euo pipefail

          FF_TAG_SHA="$(git rev-parse --verify "refs/tags/${FF_TAG}^{commit}")"
          FF_SOURCE_SHA="$(git rev-parse HEAD)"
          if [[ "$FF_TAG_SHA" != "$FF_SOURCE_SHA" || "$FF_SOURCE_SHA" != "$FF_EXPECTED_SHA" ]]; then
            echo "::error::The release tag does not match the approved source commit."
            exit 1
          fi

          printf 'sha=%s\n' "$FF_SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Set Up The Integration Verifier
        uses: shivammathur/setup-php@2.37.1
        with:
          php-version: '8.5'
          coverage: none

      - name: Prepare The Base Image Cache
        uses: ./.github/actions/setup-docker

      - name: Build And Verify The Versioned CLI
        shell: bash
        env:
          FF_VERSION: ${{ steps.release.outputs.version }}
          FF_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail

          docker build \
            --platform "$FF_PLATFORM" \
            --build-arg "COMPOSER_ROOT_VERSION=$FF_VERSION" \
            --tag fast-forward-changelog:release-check \
            .

          php tests/Container/verify.php fast-forward-changelog:release-check "$FF_VERSION"

  publish:
    name: Publish Release Image
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:

      - name: Check Out The Validated Release Commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false

      - name: Prepare The Base Image Cache
        uses: ./.github/actions/setup-docker

      - name: Set Up QEMU
        uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: arm64

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log In To GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Prepare The Multi-Platform Release Image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ needs.validate.outputs.image }}:${{ needs.validate.outputs.version }}
          build-args: |
            COMPOSER_ROOT_VERSION=${{ needs.validate.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.revision=${{ needs.validate.outputs.sha }}
            org.opencontainers.image.licenses=MIT
          provenance: true
          sbom: true
          cache-from: type=gha,scope=changelog-release-image

      - name: Revalidate The Remote Release Tag Before Publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FF_TAG: ${{ needs.validate.outputs.tag }}
          FF_APPROVED_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail

          FF_OBJECT="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${FF_TAG}" --jq '[.object.type, .object.sha] | @tsv')"
          IFS=$'\t' read -r FF_TYPE FF_REMOTE_SHA <<< "$FF_OBJECT"
          FF_DEPTH=0
          while [[ "$FF_TYPE" != 'commit' && "$FF_DEPTH" -lt 16 ]]; do
            if [[ "$FF_TYPE" != 'tag' || ! "$FF_REMOTE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
              echo "::error::The remote release tag is not bound to a commit."
              exit 1
            fi

            FF_OBJECT="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${FF_REMOTE_SHA}" --jq '[.object.type, .object.sha] | @tsv')"
            IFS=$'\t' read -r FF_TYPE FF_REMOTE_SHA <<< "$FF_OBJECT"
            FF_DEPTH=$((FF_DEPTH + 1))
          done
          if [[ "$FF_TYPE" != 'commit' || "$FF_REMOTE_SHA" != "$FF_APPROVED_SHA" ]]; then
            echo "::error::The remote release tag changed after validation."
            exit 1
          fi

      - name: Publish The Prepared Release Image
        id: image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.validate.outputs.image }}:${{ needs.validate.outputs.version }}
          build-args: |
            COMPOSER_ROOT_VERSION=${{ needs.validate.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.revision=${{ needs.validate.outputs.sha }}
            org.opencontainers.image.licenses=MIT
          provenance: true
          sbom: true
          cache-from: type=gha,scope=changelog-release-image
          cache-to: type=gha,mode=max,scope=changelog-release-image

      - name: Record The Published Image
        shell: bash
        env:
          FF_IMAGE: ${{ needs.validate.outputs.image }}
          FF_VERSION: ${{ needs.validate.outputs.version }}
          FF_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          # Markdown backticks are literal summary text.
          # shellcheck disable=SC2016
          printf 'Published `%s:%s`\n\nDigest: `%s`\n' "$FF_IMAGE" "$FF_VERSION" "$FF_DIGEST" >> "$GITHUB_STEP_SUMMARY"
