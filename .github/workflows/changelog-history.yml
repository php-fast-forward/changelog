# The caller MUST pin this reusable workflow to a reviewed full commit SHA.
name: "Reusable: Changelog History"

on:
  workflow_call:
    inputs:

      runs-on:
        description: JSON runner labels; Linux with Docker, Bash and Git is required.
        type: string
        default: '["ubuntu-latest"]'

      working-directory:
        description: 'Consumer-relative directory below the project checkout.'
        type: string
        required: false
        default: '.'

      fragment-directory:
        description: 'Consumer-relative fragment directory.'
        type: string
        required: false
        default: '.changelog'

      changelog-file:
        description: 'Consumer-relative central changelog path.'
        type: string
        required: false
        default: 'CHANGELOG.md'

      locale:
        description: 'Built-in presentation locale en or pt-BR.'
        type: string
        required: false
        default: 'en'

      template:
        description: 'Built-in template or explicit trusted base PHP template.'
        type: string
        required: false
        default: 'keep-a-changelog'

      base-ref:
        description: 'Selected local base revision; automation normally uses HEAD.'
        type: string
        required: false
        default: 'HEAD'

      tag-prefix:
        description: 'Exact stable-version tag prefix.'
        type: string
        required: false
        default: 'v'

      repository:
        description: 'Target owner/name; empty uses the caller repository.'
        type: string
        required: false
        default: ''

      source:
        description: 'Historical release notes source auto, github or tags.'
        type: string
        required: false
        default: 'auto'

      base-branch:
        description: 'Trusted base containing any explicit PHP template.'
        type: string
        required: false
        default: 'main'

      operation:
        description: 'Maintenance operation backfill or format.'
        type: string
        required: false
        default: 'backfill'

      dry-run:
        description: 'Preview maintenance without local writes.'
        type: boolean
        required: false
        default: true

      check:
        description: 'Fail when maintenance would change the maintained history.'
        type: boolean
        required: false
        default: false
    secrets:

      token:
        description: 'Optional scoped App token; otherwise uses github.token.'
        required: false
    outputs:

      result:
        description: 'Complete machine-readable operation result.'
        value: ${{ jobs.changelog.outputs.result }}

      status:
        description: 'Operation status output.'
        value: ${{ jobs.changelog.outputs.status }}

permissions: {}

jobs:
  changelog:
    name: Maintain Changelog History
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      result: ${{ steps.operation.outputs.result }}
      status: ${{ steps.operation.outputs.status }}
    steps:
      # Dynamic typing preserves new official job.workflow_* fields in older actionlint schemas.

      - name: Validate The Trusted Workflow And Consumer Path
        shell: bash
        env:
          FF_RUNTIME_REPOSITORY: ${{ fromJSON(toJSON(job)).workflow_repository }}
          FF_RUNTIME_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
          FF_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail

          if [[ -z "$FF_RUNTIME_REPOSITORY" || ! "$FF_RUNTIME_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::The called workflow identity is unavailable; a trusted immutable runtime is required."
            exit 1
          fi

          if [[ -z "$FF_WORKING_DIRECTORY" \
              || "$FF_WORKING_DIRECTORY" == /* \
              || "$FF_WORKING_DIRECTORY" =~ (^|/)\.\.(/|$) \
          ]]; then
            echo "::error::working-directory must stay below the consumer project checkout."
            exit 1
          fi

      - name: Check Out Consumer Data
        uses: actions/checkout@v6.1.0
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.base-branch }}
          token: ${{ secrets.token || github.token }}
          path: project
          fetch-depth: 0
          persist-credentials: false

      - name: Check Out The Called Workflow Runtime
        uses: actions/checkout@v6.1.0
        with:
          repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          path: .changelog-runtime
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare The Trusted Runtime Base Image Cache
        uses: ./.changelog-runtime/.github/actions/setup-docker
        with:
          dockerfile: .changelog-runtime/Dockerfile

      - name: Run The Shared History Action
        id: operation
        uses: ./.changelog-runtime/.github/actions/history
        with:
          working-directory: project/${{ inputs.working-directory }}
          fragment-directory: ${{ inputs.fragment-directory }}
          changelog-file: ${{ inputs.changelog-file }}
          locale: ${{ inputs.locale }}
          template: ${{ inputs.template }}
          base-ref: ${{ inputs.base-ref }}
          tag-prefix: ${{ inputs.tag-prefix }}
          repository: ${{ inputs.repository || github.repository }}
          source: ${{ inputs.source }}
          token: ${{ secrets.token || github.token }}
          operation: ${{ inputs.operation }}
          dry-run: ${{ inputs.dry-run }}
          check: ${{ inputs.check }}
