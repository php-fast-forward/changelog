---
name: PR Coverage Comment

"on":
    workflow_run:
        workflows: [Tests]
        types: [completed]

permissions:
    contents: read
    actions: read
    pull-requests: write

concurrency:
    group: coverage-comment-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
    cancel-in-progress: false

jobs:
    comment:
        if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled' }}
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            # The privileged workflow executes from the default branch, without checkout.
            # PR artifacts are Markdown data; no PR code or scripts are executed.
            - name: Find the current PR and report
              id: report
              # v8
              uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
              with:
                  script: |
                      const run = context.payload.workflow_run;
                      const { data: candidates } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                        ...context.repo, commit_sha: run.head_sha,
                      });
                      const matches = candidates.filter(pr =>
                        pr.state === 'open' && pr.head.sha === run.head_sha &&
                        pr.base.repo.full_name === `${context.repo.owner}/${context.repo.repo}` &&
                        pr.head.repo?.full_name === run.head_repository.full_name
                      );
                      if (matches.length !== 1) {
                        core.info('No unique open PR at this SHA; skipping stale or closed run.');
                        return;
                      }
                      core.setOutput('number', matches[0].number);
                      const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                        ...context.repo, run_id: run.id,
                      });
                      const reports = artifacts.filter(item => item.name === 'coverage-pr-comment' && !item.expired);
                      if (reports.length > 1) throw new Error('Ambiguous coverage artifacts.');
                      if (reports.length === 1) core.setOutput('artifact', reports[0].id);

            - name: Download Markdown from the triggering run
              if: steps.report.outputs.artifact != ''
              # v8.0.1
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
              with:
                  artifact-ids: ${{ steps.report.outputs.artifact }}
                  merge-multiple: true
                  path: coverage-comment
                  github-token: ${{ github.token }}
                  run-id: ${{ github.event.workflow_run.id }}

            - name: Prepare the comment and recheck the PR head
              id: current
              if: steps.report.outputs.number != ''
              # v8
              uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
              env:
                  PR_NUMBER: ${{ steps.report.outputs.number }}
                  HAS_REPORT: ${{ steps.report.outputs.artifact != '' }}
              with:
                  script: |
                      const fs = require('node:fs');
                      const run = context.payload.workflow_run;
                      const { data: pr } = await github.rest.pulls.get({
                        ...context.repo, pull_number: Number(process.env.PR_NUMBER),
                      });
                      if (pr.state !== 'open' || pr.head.sha !== run.head_sha) return;
                      let report = '### PHP line coverage\n\nNo coverage report was produced. Inspect the test run before assessing the required minimum.';
                      if (process.env.HAS_REPORT === 'true') {
                        const path = 'coverage-comment/code-coverage-results.md';
                        const stat = fs.lstatSync(path);
                        if (!stat.isFile() || stat.size > 60000) throw new Error('Invalid coverage Markdown artifact.');
                        report = fs.readFileSync(path, 'utf8');
                      }
                      report += `\n\nCommit: \`${run.head_sha}\`. [Test run](${run.html_url}) — ${run.conclusion}.\n`;
                      fs.writeFileSync('coverage-comment.md', report);
                      core.setOutput('number', pr.number);

            - name: Update the sticky coverage comment
              if: steps.current.outputs.number != ''
              # v2.9.4
              uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405
              with:
                  header: code-coverage-overview
                  number: ${{ steps.current.outputs.number }}
                  path: coverage-comment.md
