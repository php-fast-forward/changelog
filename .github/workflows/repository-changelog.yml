name: 'Repository: Changelog'

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

  push:
    branches: [main]

permissions: {}

jobs:
  check:
    name: Check Contribution
    if: github.event_name == 'pull_request'
    concurrency:
      group: check-changelog-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
      issues: read
    uses: ./.github/workflows/changelog-check.yml
    with:
      working-directory: '.'
      repository: ${{ github.repository }}
      pull-request: ${{ github.event.pull_request.number }}
      head-sha: ${{ github.event.pull_request.head.sha }}
      base-sha: ${{ github.event.pull_request.base.sha }}
      managed-branch: changelog/version
      automation-actor: ${{ vars.CHANGELOG_AUTOMATION_ACTOR || 'github-actions[bot]' }}

  changelog:
    name: Changelog Lifecycle
    if: github.event_name != 'pull_request'
    # Each public operation owns its lock; reusing a nested group here would deadlock.
    permissions:
      contents: write
      pull-requests: write
      issues: read
      statuses: write
    uses: ./.github/workflows/changelog.yml
    with:
      base-branch: main
      version-pr-title: 'chore(release): fast-forward/changelog v{current_version} → v{next_version}'
      automation-actor: ${{ vars.CHANGELOG_AUTOMATION_ACTOR || 'github-actions[bot]' }}
      comment-mode: always
      prepare-release: true
      publish: true
      # Enable only after separately approved environment/key staging.
      # Until then, retain the existing publication credential route.
      publish-app-client-id: ${{ vars.RELEASE_CHANNEL_PUBLICATION_ENABLED == 'true' && 'Iv23liHqRng02H747IYa' || '' }}
      publish-environment: ${{ vars.RELEASE_CHANNEL_PUBLICATION_ENABLED == 'true' && 'release-channels' || '' }}
    secrets:
      token: ${{ secrets.CHANGELOG_TOKEN || github.token }}
      publish-app-private-key: ${{ vars.RELEASE_CHANNEL_PUBLICATION_ENABLED == 'true' && secrets.app-private-key || '' }}

  image:
    name: Publish Docker CLI
    needs: changelog
    if: >-
      github.event_name == 'pull_request_target' && github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'changelog/version' &&
      github.event.pull_request.base.ref == 'main' &&
      needs.changelog.result == 'success' &&
      needs.changelog.outputs.published-version != '' &&
      needs.changelog.outputs.published-tag != '' &&
      needs.changelog.outputs.published-sha != '' &&
      needs.changelog.outputs.published-sha == github.event.pull_request.merge_commit_sha
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/repository-image.yml
    with:
      tag: ${{ needs.changelog.outputs.published-tag }}
      expected-sha: ${{ needs.changelog.outputs.published-sha }}
