# Pin the public entrypoint to a reviewed full commit SHA.
name: Changelog PR feedback

on:
  workflow_call:
    inputs:
      pull-request:
        description: Open PR to validate.
        type: number
        required: true
      head-sha:
        description: Exact PR head from the event or successful automation result.
        type: string
        required: true
      base-sha:
        description: Exact event base; empty resolves the live PR base before validation.
        type: string
        default: ''
      base-branch:
        description: Release line; empty uses the default branch.
        type: string
        default: ''
      fragment-directory:
        type: string
        default: '.changelog'
      changelog-file:
        type: string
        default: 'CHANGELOG.md'
      locale:
        type: string
        default: 'en'
      tag-prefix:
        type: string
        default: 'v'
      source:
        type: string
        default: 'auto'
      managed-branch:
        type: string
        default: 'changelog/version'
      automation-actor:
        type: string
        default: 'github-actions[bot]'
      waiver-label:
        type: string
        default: 'changelog-not-required'
      maintenance-label:
        type: string
        default: 'changelog-maintenance'
      comment-mode:
        description: always, on-failure or never; always updates one sticky comment.
        type: string
        default: 'always'
    secrets:
      token:
        description: Optional scoped App token; defaults to github.token.
        required: false
    outputs:
      result:
        description: Exact validation feedback JSON, including invalid contributions.
        value: ${{ jobs.status.outputs.result }}
      status:
        description: valid or invalid.
        value: ${{ jobs.status.outputs.status }}

permissions: {}

concurrency:
  group: changelog-feedback-${{ github.repository }}-${{ inputs.pull-request }}
  cancel-in-progress: false

jobs:
  status:
    name: Validate exact PR head
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: read
      statuses: write
    outputs:
      result: ${{ steps.operation.outputs.result }}
      status: ${{ steps.operation.outputs.status }}
    steps:
      - name: Resolve trusted context and immutable comparison
        id: snapshot
        shell: bash
        env:
          FF_RUNTIME_REPOSITORY: ${{ fromJSON(toJSON(job)).workflow_repository }}
          FF_RUNTIME_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
          FF_EVENT: ${{ github.event_name }}
          FF_REF: ${{ github.ref }}
          FF_EVENT_PR: ${{ github.event.pull_request.number }}
          FF_PR: ${{ inputs.pull-request }}
          FF_HEAD: ${{ inputs.head-sha }}
          FF_BASE: ${{ inputs.base-sha }}
          FF_BRANCH: ${{ inputs.base-branch || github.event.repository.default_branch }}
          FF_COMMENT_MODE: ${{ inputs.comment-mode }}
          GH_TOKEN: ${{ secrets.token || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ -z "$FF_RUNTIME_REPOSITORY" || ! "$FF_RUNTIME_SHA" =~ ^[a-f0-9]{40}$ \
              || ! "$FF_PR" =~ ^[1-9][0-9]*$ || ! "$FF_HEAD" =~ ^[a-f0-9]{40}$ ]]; then
            echo '::error::An immutable runtime and complete PR snapshot are required.'
            exit 1
          fi

          case "$FF_COMMENT_MODE" in
            always|on-failure|never) ;;
            *) echo '::error::comment-mode must be always, on-failure or never.'; exit 1 ;;
          esac

          case "$FF_EVENT" in
            pull_request_target)
              [[ "$FF_PR" == "$FF_EVENT_PR" ]] || exit 1
              ;;
            push|workflow_dispatch)
              [[ "$FF_REF" == "refs/heads/$FF_BRANCH" ]] || exit 1
              ;;
            *) echo '::error::Feedback requires a trusted base event.'; exit 1 ;;
          esac

          if [[ -z "$FF_BASE" ]]; then
            FF_BASE=$(gh api "repos/$GH_REPO/pulls/$FF_PR" --jq .base.sha)
          fi

          [[ "$FF_BASE" =~ ^[a-f0-9]{40}$ ]] || exit 1
          echo "base=$FF_BASE" >> "$GITHUB_OUTPUT"

      - name: Check out consumer data without executing it
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.head-sha }}
          path: project
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the called workflow runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          path: .changelog-runtime
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare the trusted runtime base image cache
        uses: ./.changelog-runtime/.github/actions/setup-docker
        with:
          dockerfile: .changelog-runtime/Dockerfile

      - name: Validate and render feedback, including failed contributions
        id: operation
        continue-on-error: true
        uses: ./.changelog-runtime/.github/actions/pr-status
        with:
          working-directory: project
          repository: ${{ github.repository }}
          token: ${{ secrets.token || github.token }}
          pull-request: ${{ inputs.pull-request }}
          head-sha: ${{ inputs.head-sha }}
          base-sha: ${{ steps.snapshot.outputs.base }}
          base-branch: ${{ inputs.base-branch || github.event.repository.default_branch }}
          fragment-directory: ${{ inputs.fragment-directory }}
          changelog-file: ${{ inputs.changelog-file }}
          locale: ${{ inputs.locale }}
          tag-prefix: ${{ inputs.tag-prefix }}
          source: ${{ inputs.source }}
          managed-branch: ${{ inputs.managed-branch }}
          automation-actor: ${{ inputs.automation-actor }}
          waiver-label: ${{ inputs.waiver-label }}
          maintenance-label: ${{ inputs.maintenance-label }}
          publish-status: 'true'

      - name: Preserve the contribution gate failure
        if: steps.operation.outcome != 'success'
        shell: bash
        run: exit 1

  comment:
    name: Update PR changelog comment
    needs: status
    if: >-
      !cancelled() && (inputs.comment-mode == 'always' || inputs.comment-mode == 'on-failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Discard feedback if the PR moved or closed
        id: fresh
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.token || github.token }}
          GH_REPO: ${{ github.repository }}
          FF_PR: ${{ inputs.pull-request }}
          FF_HEAD: ${{ inputs.head-sha }}
          FF_BASE: ${{ inputs.base-sha || fromJSON(needs.status.outputs.result || '{"base_sha":""}').base_sha }}
          FF_BRANCH: ${{ inputs.base-branch || github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          [[ "$FF_PR" =~ ^[1-9][0-9]*$ && "$FF_HEAD" =~ ^[a-f0-9]{40}$ ]] || exit 1
          snapshot=$(gh api "repos/$GH_REPO/pulls/$FF_PR")
          if [[ $(jq -r .state <<< "$snapshot") == open \
              && $(jq -r .head.sha <<< "$snapshot") == "$FF_HEAD" \
              && $(jq -r .base.ref <<< "$snapshot") == "$FF_BRANCH" \
              && ( -z "$FF_BASE" || $(jq -r .base.sha <<< "$snapshot") == "$FF_BASE" ) ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update one changelog comment
        if: steps.fresh.outputs.current == 'true'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          GITHUB_TOKEN: ${{ secrets.token || github.token }}
          number: ${{ inputs.pull-request }}
          header: fast-forward-changelog
          only_update: ${{ inputs.comment-mode == 'on-failure' && needs.status.outputs.status == 'valid' }}
          message: ${{ fromJSON(needs.status.outputs.result || '{"comment_body":"## Changelog\n\n❌ Validation could not complete. Inspect this workflow run for the operational diagnostic. No successful contribution result is claimed."}').comment_body }}
