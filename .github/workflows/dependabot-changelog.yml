name: Dependabot Changelog

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: dependabot-changelog-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  fragment:
    name: Create Dependabot Fragment
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    outputs:
      head-sha: ${{ steps.operation.outputs.head-sha }}
    steps:

      - name: Check Out The Trusted Base
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare The Base Image Cache
        uses: ./.github/actions/setup-docker

      - name: Collect Verified Dependency Metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2.5.0
        with:
          github-token: ${{ secrets.CHANGELOG_TOKEN || github.token }}
          alert-lookup: 'false'
          compat-lookup: 'false'
          skip-verification: 'false'
          skip-commit-verification: 'false'

      - name: Add One Deterministic Dependabot Fragment
        id: operation
        uses: ./.github/actions/dependabot
        with:
          working-directory: '.'
          repository: ${{ github.repository }}
          token: ${{ secrets.CHANGELOG_TOKEN || github.token }}
          pull-request: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}
          dependency-names: ${{ steps.metadata.outputs.dependency-names }}
          dependency-type: ${{ steps.metadata.outputs.dependency-type }}
          ecosystem: ${{ steps.metadata.outputs.package-ecosystem }}
          security-alert-numbers: '[]'

  feedback:
    name: Validate Updated Dependabot Head
    needs: fragment
    if: needs.fragment.result == 'success'
    permissions:
      contents: read
      pull-requests: write
      issues: read
      statuses: write
    uses: ./.github/workflows/changelog-pr-status.yml
    with:
      pull-request: ${{ github.event.pull_request.number }}
      head-sha: ${{ needs.fragment.outputs.head-sha || github.event.pull_request.head.sha }}
      base-sha: ${{ github.event.pull_request.base.sha }}
      base-branch: main
      automation-actor: ${{ vars.CHANGELOG_AUTOMATION_ACTOR || 'github-actions[bot]' }}
      comment-mode: always
    secrets:
      token: ${{ secrets.CHANGELOG_TOKEN || github.token }}
