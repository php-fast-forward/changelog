name: 'Repository: Release Channels'

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release-channels-${{ github.repository }}
  cancel-in-progress: false

jobs:
  channel:
    name: Update Released Major Tag
    if: >-
      github.repository == 'php-fast-forward/changelog' &&
      github.event.release.draft == false && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release-channels
    permissions:
      contents: read
    steps:
      - name: Require A Full Stable Release Tag
        shell: bash
        env:
          FF_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$FF_RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo '::error::Release channels require a full stable vMAJOR.MINOR.PATCH tag.'
            exit 1
          }

      - name: Create The Channel App Token
        id: channel-app
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.RELEASE_CHANNEL_APP_CLIENT_ID }}
          private-key: ${{ secrets.app-private-key }}
          owner: php-fast-forward
          repositories: changelog
          permission-contents: write
          permission-workflows: write
          skip-token-revoke: 'false'

      - name: Update The Released Major Tag
        uses: Actions-R-Us/actions-tagger@v2.0.3
        with:
          token: ${{ steps.channel-app.outputs.token }}
          prefer_branch_releases: 'false'
          publish_latest_tag: 'true'
