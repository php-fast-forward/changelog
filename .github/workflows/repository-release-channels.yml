name: 'Repository: Release Channels'

on:
  workflow_call:
    inputs:
      tag:
        description: 'Existing published stable release tag, such as v0.1.0.'
        type: string
        required: true
      expected-sha:
        description: 'Full commit SHA of the existing release tag.'
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing published stable release tag, such as v0.1.0.'
        type: string
        required: true
      expected-sha:
        description: 'Full commit SHA of the existing release tag.'
        type: string
        required: true

permissions: {}

concurrency:
  group: release-channels-${{ github.repository }}
  cancel-in-progress: false

jobs:
  channel:
    name: Update Released Major Branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-channels
    permissions:
      contents: read
    steps:
      - name: Require A Trusted Repository Workflow
        shell: bash
        env:
          FF_REPOSITORY: ${{ github.repository }}
          FF_RUNTIME_REPOSITORY: ${{ fromJSON(toJSON(job)).workflow_repository }}
          FF_RUNTIME_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
          FF_EVENT: ${{ github.event_name }}
          FF_REF: ${{ github.ref }}
          FF_WORKFLOW_REF: ${{ github.workflow_ref }}
          FF_ACTION: ${{ github.event.action }}
          FF_MERGED: ${{ github.event.pull_request.merged }}
          FF_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          FF_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          FF_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          FF_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          FF_EXPECTED_SHA: ${{ inputs.expected-sha }}
        run: |
          set -euo pipefail
          if [[ "$FF_REPOSITORY" != php-fast-forward/changelog \
              || "$FF_RUNTIME_REPOSITORY" != "$FF_REPOSITORY" \
              || ! "$FF_RUNTIME_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo '::error::Release channels belong only to the canonical repository.'
            exit 1
          fi
          if [[ "$FF_EVENT" == workflow_dispatch && "$FF_REF" == refs/heads/main \
              && "$FF_WORKFLOW_REF" == "$FF_REPOSITORY/.github/workflows/repository-release-channels.yml@refs/heads/main" ]]; then
            exit 0
          fi
          if [[ "$FF_EVENT" != pull_request_target || "$FF_REF" != refs/heads/main \
              || "$FF_WORKFLOW_REF" != "$FF_REPOSITORY/.github/workflows/repository-changelog.yml@refs/heads/main" \
              || "$FF_ACTION" != closed \
              || "$FF_MERGED" != true || "$FF_HEAD_REPOSITORY" != "$FF_REPOSITORY" \
              || "$FF_HEAD_BRANCH" != changelog/version || "$FF_BASE_BRANCH" != main \
              || "$FF_MERGE_SHA" != "$FF_EXPECTED_SHA" ]]; then
            echo '::error::Use verified managed-merge publication or manual recovery from main.'
            exit 1
          fi

      - name: Check Out The Trusted Workflow Revision
        uses: actions/checkout@v7.0.1
        with:
          # Bind the helper to this exact trusted workflow implementation, never a PR head.
          repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          persist-credentials: false

      - name: Set Up PHP
        uses: shivammathur/setup-php@2.37.1
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install The Locked Runtime Without Plugins Or Scripts
        shell: bash
        env:
          COMPOSER_HOME: ${{ runner.temp }}/release-channel-composer-home
          COMPOSER_CACHE_DIR: ${{ runner.temp }}/release-channel-composer-cache
        run: composer install --no-dev --no-plugins --no-scripts --no-interaction --prefer-dist --no-progress

      - name: Require Dedicated Channel Credentials
        shell: bash
        env:
          FF_CLIENT_ID: ${{ vars.RELEASE_CHANNEL_APP_CLIENT_ID }}
          FF_APP_SLUG: ${{ vars.RELEASE_CHANNEL_APP_SLUG }}
          FF_PRIVATE_KEY: ${{ secrets.RELEASE_CHANNEL_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$FF_CLIENT_ID" || -z "$FF_PRIVATE_KEY" || -z "$FF_APP_SLUG" \
              || "$FF_APP_SLUG" == github-actions ]]; then
            echo '::error::Configure the dedicated channel App in the protected release-channels environment.'
            exit 1
          fi

      - name: Mint The Dedicated Channel Installation Token
        id: channel-app
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.RELEASE_CHANNEL_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_CHANNEL_APP_PRIVATE_KEY }}
          owner: php-fast-forward
          repositories: changelog
          permission-contents: write
          permission-workflows: write
          permission-pull-requests: read
          skip-token-revoke: 'false'

      - name: Confirm The Dedicated Channel Identity
        shell: bash
        env:
          FF_EXPECTED_SLUG: ${{ vars.RELEASE_CHANNEL_APP_SLUG }}
          FF_ACTUAL_SLUG: ${{ steps.channel-app.outputs.app-slug }}
        run: |
          set -euo pipefail
          if [[ -z "$FF_ACTUAL_SLUG" || "$FF_ACTUAL_SLUG" != "$FF_EXPECTED_SLUG" ]]; then
            echo '::error::Channel installation identity differs from the approved App.'
            exit 1
          fi

      - name: Advance The Verified Released Major Branch
        shell: bash
        env:
          GH_TOKEN: ${{ steps.channel-app.outputs.token }}
          FF_REPOSITORY: ${{ github.repository }}
          FF_TAG: ${{ inputs.tag }}
          FF_EXPECTED_SHA: ${{ inputs.expected-sha }}
        run: php .github/update-release-channels.php "$FF_REPOSITORY" "$FF_TAG" "$FF_EXPECTED_SHA"
