name: 'Repository: Release Channels'

on:
  release:
    types: [published, edited]

permissions: {}

concurrency:
  group: release-channels-${{ github.repository }}
  cancel-in-progress: false

jobs:
  channel:
    name: Update Released Major Branch
    if: >-
      github.repository == 'php-fast-forward/changelog' &&
      github.event.release.draft == false && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release-channels
    permissions:
      contents: read
    steps:
      - name: Select The Published Release Channels
        id: release
        uses: actions/github-script@v9.0.0
        env:
          FF_RELEASE_TAG: ${{ github.event.release.tag_name }}
        with:
          script: |
            const tag = process.env.FF_RELEASE_TAG;
            const version = name => {
              const match = /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.exec(name);
              return match && match[0] === name ? match.slice(1).map(BigInt) : null;
            };
            const selected = version(tag);
            if (!selected) throw new Error('The release version cannot be compared.');
            const tags = await github.paginate(github.rest.repos.listTags, { ...context.repo, per_page: 100 });
            const compare = (left, right) => {
              for (let index = 0; index < 3; ++index) {
                if (left[index] !== right[index]) return left[index] > right[index] ? 1 : -1;
              }
              return 0;
            };
            const stable = tags.map(item => version(item.name)).filter(Boolean);
            core.setOutput('promote', !stable.some(item => item[0] === selected[0] && compare(item, selected) > 0));
            core.setOutput('latest', !stable.some(item => compare(item, selected) > 0));

      - name: Create The Channel App Token
        id: channel-app
        if: steps.release.outputs.promote == 'true'
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.RELEASE_CHANNEL_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_CHANNEL_APP_PRIVATE_KEY }}
          owner: php-fast-forward
          repositories: changelog
          permission-contents: write
          permission-workflows: write
          skip-token-revoke: 'false'

      - name: Update The Released Major Branch
        if: steps.release.outputs.promote == 'true'
        uses: Actions-R-Us/actions-tagger@v2
        with:
          token: ${{ steps.channel-app.outputs.token }}
          prefer_branch_releases: 'true'
          publish_latest_tag: ${{ steps.release.outputs.latest }}
