name: 'Repository: Tests'

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      artifact:
        description: Fully qualified canonical executable artifact ID.
        value: ${{ jobs.compiled.outputs.artifact }}

permissions:
  contents: read
  actions: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_PROCESS_TIMEOUT: '600'

jobs:
  impact:
    uses: ./.github/workflows/repository-impact.yml

  phar-build:
    needs: impact
    if: needs.impact.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      stale: ${{ steps.parity.outputs.stale }}
      artifact: ${{ steps.candidate.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.5'
          extensions: curl, iconv, mbstring, phar, zlib
          tools: composer:v2, box:4.7.1
          coverage: none
      - name: Build once from a Git-free production runtime
        env:
          COMPOSER_ROOT_VERSION: dev-main
          COMPOSER_HOME: ${{ runner.temp }}/changelog-phar-composer-home
          COMPOSER_CACHE_DIR: ${{ runner.temp }}/changelog-phar-composer-cache
        run: |
          mkdir "$RUNNER_TEMP/changelog-runtime"
          git archive HEAD | tar -xf - -C "$RUNNER_TEMP/changelog-runtime"
          composer install --working-dir="$RUNNER_TEMP/changelog-runtime" --no-dev --no-plugins --no-scripts --prefer-dist --classmap-authoritative --no-interaction --no-progress
          composer check-platform-reqs --working-dir="$RUNNER_TEMP/changelog-runtime" --no-dev
          box validate --ignore-recommendations-and-warnings "$RUNNER_TEMP/changelog-runtime/box.json"
          box compile --no-parallel --sort-compiled-files --config="$RUNNER_TEMP/changelog-runtime/box.json"
          install -m 755 "$RUNNER_TEMP/changelog-runtime/dist/changelog" "$RUNNER_TEMP/changelog"
          box verify "$RUNNER_TEMP/changelog"
      - name: Compare the committed executable before execution
        id: parity
        shell: bash
        run: |
          set +e
          cmp "$RUNNER_TEMP/changelog" dist/changelog
          status=$?
          set -e
          case "$status" in
            0) echo 'stale=false' >> "$GITHUB_OUTPUT" ;;
            1) echo 'stale=true' >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac
      - id: candidate
        uses: actions/upload-artifact@v7.0.2
        with:
          name: changelog-build-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/changelog
          compression-level: 0
          if-no-files-found: error

  phar-runtime:
    needs: phar-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.5'
          extensions: curl, iconv, mbstring, phar, zlib
          tools: composer:v2
          coverage: none
      - run: composer install --no-dev --no-plugins --no-scripts --prefer-dist --classmap-authoritative --no-interaction --no-progress
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.phar-build.outputs.artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/phar
      - name: Qualify the same compiled bytes on every supported platform
        run: php tests/Phar/verify.php "${{ runner.temp }}/phar/changelog"

  packaging:
    needs: [impact, phar-build]
    if: ${{ always() && !cancelled() }}
    name: Fresh Composer Installations (${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        dependencies: [highest, lowest]

    steps:
      - name: Require A Complete Validation Decision
        env:
          FF_RESULT: ${{ needs.impact.result }}
          FF_RUNTIME: ${{ needs.impact.outputs.runtime }}
          FF_BUILD: ${{ needs.phar-build.result }}
        shell: bash
        run: |
          if [[ "$FF_RESULT" != 'success' || ! "$FF_RUNTIME" =~ ^(true|false)$ ]]; then
            echo '::error::Validation scope failed or is incomplete; this required check cannot pass.'
            exit 1
          fi
          if [[ "$FF_RUNTIME" == 'true' && "$FF_BUILD" != 'success' ]]; then
            echo '::error::The PHAR candidate was not built successfully.'
            exit 1
          fi

      - name: Explain The Editorial Validation Scope
        if: needs.impact.outputs.runtime == 'false'
        shell: bash
        run: echo 'No runtime inputs changed. Changelog contribution validation remains required.' >> "$GITHUB_STEP_SUMMARY"

      - name: Check Out Repository
        if: needs.impact.outputs.runtime == 'true'
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set Up PHP
        if: needs.impact.outputs.runtime == 'true'
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Download The Exact PHAR Candidate
        if: needs.impact.outputs.runtime == 'true'
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.phar-build.outputs.artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/phar

      - name: Validate Fresh Local And Global Consumers
        if: needs.impact.outputs.runtime == 'true'
        run: php tests/Packaging/verify.php
        env:
          CHANGELOG_PACKAGING_DIRECT: '1'
          CHANGELOG_PACKAGING_DEPENDENCIES: ${{ matrix.dependencies }}
          CHANGELOG_PHAR_CANDIDATE: ${{ runner.temp }}/phar/changelog

  component-compatibility:
    needs: impact
    if: ${{ always() && !cancelled() }}
    name: Symfony ${{ matrix.components }} Component Minimums
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        components: ['7.4', '8.1']

    steps:
      - name: Require A Complete Validation Decision
        env:
          FF_RESULT: ${{ needs.impact.result }}
          FF_RUNTIME: ${{ needs.impact.outputs.runtime }}
        shell: bash
        run: |
          if [[ "$FF_RESULT" != 'success' || ! "$FF_RUNTIME" =~ ^(true|false)$ ]]; then
            echo '::error::Validation scope failed or is incomplete; this required check cannot pass.'
            exit 1
          fi

      - name: Explain The Editorial Validation Scope
        if: needs.impact.outputs.runtime == 'false'
        shell: bash
        run: echo 'No runtime inputs changed. Changelog contribution validation remains required.' >> "$GITHUB_STEP_SUMMARY"

      - name: Check Out Repository
        if: needs.impact.outputs.runtime == 'true'
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set Up PHP
        if: needs.impact.outputs.runtime == 'true'
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Isolate Composer State
        if: needs.impact.outputs.runtime == 'true'
        run: |
          echo "COMPOSER_HOME=$RUNNER_TEMP/composer-home" >> "$GITHUB_ENV"
          echo "COMPOSER_CACHE_DIR=$RUNNER_TEMP/composer-cache" >> "$GITHUB_ENV"

      - name: Resolve The Compatible Minimum Graph
        if: needs.impact.outputs.runtime == 'true'
        env:
          SYMFONY_COMPONENT_VERSION: ${{ matrix.components }}
        run: |
          # Minimize runtime requirements and their dependencies; retain locked test tools.
          # Console retains its separate 8.1 minimum for native Ask constraints.
          composer update \
            container-interop/service-provider \
            fast-forward/clock \
            fast-forward/config \
            fast-forward/container \
            psr/clock \
            psr/container \
            symfony/console \
            symfony/filesystem \
            symfony/finder \
            symfony/http-client \
            symfony/lock \
            symfony/process \
            symfony/validator \
            thecodingmachine/safe \
            symfony/yaml \
            --with-dependencies \
            --prefer-lowest \
            --with="symfony/filesystem:${SYMFONY_COMPONENT_VERSION}.*" \
            --with="symfony/finder:${SYMFONY_COMPONENT_VERSION}.*" \
            --with="symfony/http-client:${SYMFONY_COMPONENT_VERSION}.*" \
            --with="symfony/lock:${SYMFONY_COMPONENT_VERSION}.*" \
            --with="symfony/process:${SYMFONY_COMPONENT_VERSION}.*" \
            --with="symfony/validator:${SYMFONY_COMPONENT_VERSION}.*" \
            --no-plugins \
            --no-scripts \
            --no-interaction \
            --no-progress \
            --prefer-dist

      - name: Verify Actual Platform Requirements
        if: needs.impact.outputs.runtime == 'true'
        run: composer check-platform-reqs --no-plugins

      - name: Test Unit Contracts On The Minimum Graph
        if: needs.impact.outputs.runtime == 'true'
        run: >-
          vendor/bin/phpunit
          --testsuite unit
          --no-coverage
          --fail-on-deprecation
          --fail-on-phpunit-deprecation

      - name: Test Real Git And HTTP Integration
        if: needs.impact.outputs.runtime == 'true'
        run: >-
          vendor/bin/phpunit
          --testsuite integration
          --no-coverage
          --fail-on-deprecation
          --fail-on-phpunit-deprecation

      - name: Verify CLI And Provider Composition
        if: needs.impact.outputs.runtime == 'true'
        run: |
          php bin/changelog list --raw

          compatibility_project=$(mktemp -d "$RUNNER_TEMP/changelog-compatibility.XXXXXX")

          php resources/skills/fast-forward-changelog/examples/contribution.php \
            "$PWD/vendor/autoload.php" \
            "$compatibility_project"

  tests:
    needs: impact
    if: ${{ always() && !cancelled() }}
    name: ${{ matrix.check }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            check: PHP 8.5 (ubuntu-latest)
            shard: all
            integration-arguments: ''
          - os: ubuntu-24.04-arm
            check: PHP 8.5 (ubuntu-24.04-arm)
            shard: all
            integration-arguments: ''
          - os: windows-latest
            check: Windows Integration (references)
            shard: references
            integration-arguments: --group windows-references --exclude-filter=.#2
          - os: windows-latest
            check: Windows Integration (stacked references)
            shard: stacked-references
            integration-arguments: --group windows-references --filter=.#2
          - os: windows-latest
            check: Windows Integration (provenance)
            shard: provenance
            integration-arguments: --group windows-provenance
          - os: windows-latest
            check: Windows Integration (publication)
            shard: publication
            integration-arguments: --exclude-group windows-references --exclude-group windows-provenance

    steps:
      - name: Require A Complete Validation Decision
        env:
          FF_RESULT: ${{ needs.impact.result }}
          FF_RUNTIME: ${{ needs.impact.outputs.runtime }}
        shell: bash
        run: |
          if [[ "$FF_RESULT" != 'success' || ! "$FF_RUNTIME" =~ ^(true|false)$ ]]; then
            echo '::error::Validation scope failed or is incomplete; this required check cannot pass.'
            exit 1
          fi

      - name: Explain The Editorial Validation Scope
        if: needs.impact.outputs.runtime == 'false'
        shell: bash
        run: echo 'No runtime inputs changed. Changelog contribution validation remains required.' >> "$GITHUB_STEP_SUMMARY"

      - name: Check Out Repository
        if: needs.impact.outputs.runtime == 'true'
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set Up PHP
        if: needs.impact.outputs.runtime == 'true'
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.5'
          coverage: ${{ matrix.os == 'ubuntu-latest' && 'xdebug' || 'none' }}
          tools: composer:v2

      - name: Isolate Composer State
        if: needs.impact.outputs.runtime == 'true'
        shell: bash
        run: |
          echo "COMPOSER_HOME=$RUNNER_TEMP/composer-home" >> "$GITHUB_ENV"
          echo "COMPOSER_CACHE_DIR=$RUNNER_TEMP/composer-cache" >> "$GITHUB_ENV"

      - name: Validate Composer Metadata
        if: needs.impact.outputs.runtime == 'true'
        run: composer validate --strict

      - name: Install Development Dependencies
        if: needs.impact.outputs.runtime == 'true'
        run: >-
          composer install
          --no-interaction
          --prefer-dist
          --no-plugins
          --no-scripts
          --no-progress

      - name: Run The Package Quality And Unit Coverage Gates
        if: needs.impact.outputs.runtime == 'true' && matrix.os == 'ubuntu-latest'
        run: composer check
        env:
          XDEBUG_MODE: coverage

      - name: Test Unit Contracts On This Platform
        if: needs.impact.outputs.runtime == 'true' && matrix.os != 'ubuntu-latest'
        run: vendor/bin/phpunit --testsuite unit --no-coverage

      - name: Smoke Test The CLI
        if: needs.impact.outputs.runtime == 'true'
        run: php bin/changelog list --raw

      - name: Prepare Integration Diagnostics Directory
        if: needs.impact.outputs.runtime == 'true'
        run: php -r "is_dir('.build') || mkdir('.build', 0777, true);"

      - name: Test Integration Contracts In Disposable Git Repositories
        if: needs.impact.outputs.runtime == 'true'
        run: >-
          vendor/bin/phpunit
          --testsuite integration
          --no-coverage
          --log-junit .build/integration.xml
          --log-events-text .build/integration-events.log --debug
          ${{ matrix.integration-arguments }}
        env:
          XDEBUG_MODE: 'off'
          FF_INTEGRATION_PROGRESS_LOG: .build/integration-progress.log

      - name: Preserve Windows Integration Diagnostics
        if: always() && needs.impact.outputs.runtime == 'true' && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-integration-${{ matrix.shard }}
          path: |
            .build/integration.xml
            .build/integration-events.log
            .build/integration-progress.log
          if-no-files-found: warn
          retention-days: 14

      - name: Verify Reusable Workflow Guards And Contracts Without Network
        if: needs.impact.outputs.runtime == 'true' && startsWith(matrix.os, 'ubuntu-')
        run: composer test:workflows

      - name: Prepare The Runner-Local Base Image Cache
        if: needs.impact.outputs.runtime == 'true' && startsWith(matrix.os, 'ubuntu-')
        uses: ./.github/actions/setup-docker

      - name: Build The Packaged CLI Image
        # Base images are preloaded by the preceding runner-local cache step.
        if: needs.impact.outputs.runtime == 'true' && startsWith(matrix.os, 'ubuntu-')
        run: docker build --progress=plain -t fast-forward-changelog:ci .

      - name: Verify The Actual Container CLI In Disposable Consumers
        if: needs.impact.outputs.runtime == 'true' && startsWith(matrix.os, 'ubuntu-')
        run: php tests/Container/verify.php fast-forward-changelog:ci

      - name: Verify The Composer Root Version Build Argument
        if: needs.impact.outputs.runtime == 'true' && startsWith(matrix.os, 'ubuntu-')
        run: |
          docker build \
            --build-arg COMPOSER_ROOT_VERSION=1.2.3 \
            --tag fast-forward-changelog:version-fixture \
            .

          php tests/Container/verify.php fast-forward-changelog:version-fixture 1.2.3

      - name: Verify Docker Action Invocation And Runner Outputs
        if: needs.impact.outputs.runtime == 'true' && startsWith(matrix.os, 'ubuntu-')
        id: docker-action
        uses: ./.github/actions/history
        with:
          operation: format
          dry-run: 'true'
          source: tags

      - name: Verify The Docker Action Output Contract
        if: needs.impact.outputs.runtime == 'true' && startsWith(matrix.os, 'ubuntu-')
        env:
          FF_ACTION_RESULT: ${{ steps.docker-action.outputs.result }}
          FF_ACTION_STATUS: ${{ steps.docker-action.outputs.status }}
        run: |
          # PHP evaluates these variables; shell quoting is intentional.
          # shellcheck disable=SC2016
          php -r '
              $result = json_decode(
                  getenv("FF_ACTION_RESULT"),
                  true,
                  512,
                  JSON_THROW_ON_ERROR,
              );

              if (
                  $result["status"] !== "dry-run"
                  || getenv("FF_ACTION_STATUS") !== "dry-run"
              ) {
                  exit(1);
              }
          '

      - name: Upload Native Line Coverage From This Run
        if: >-
          ${{ needs.impact.outputs.runtime == 'true' && success() && matrix.os == 'ubuntu-latest' &&
              ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
               (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-report-php
          path: .build/coverage.xml
          if-no-files-found: error
          retention-days: 30

  windows:
    name: PHP 8.5 (windows-latest)
    needs: tests
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require All Platform And Windows Shard Results
        env:
          FF_RESULT: ${{ needs.tests.result }}
        shell: bash
        run: |
          if [[ "$FF_RESULT" != 'success' ]]; then
            echo '::error::A platform or Windows shard did not pass; inspect the matrix results.'
            exit 1
          fi

  compiled:
    name: Compiled CLI Matches Qualified Source
    needs: [phar-build, phar-runtime, packaging, component-compatibility, tests, windows]
    if: always() && needs.phar-build.result != 'skipped'
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ needs.phar-build.outputs.artifact }}
    steps:
      - name: Require Successful Source And Artifact Qualification
        env:
          BUILD: ${{ needs.phar-build.result }}
          RUNTIME: ${{ needs.phar-runtime.result }}
          PACKAGING: ${{ needs.packaging.result }}
          COMPONENTS: ${{ needs.component-compatibility.result }}
          TESTS: ${{ needs.tests.result }}
          WINDOWS: ${{ needs.windows.result }}
        run: |
          test "$BUILD" = success && test "$RUNTIME" = success &&
          test "$PACKAGING" = success && test "$COMPONENTS" = success &&
          test "$TESTS" = success && test "$WINDOWS" = success
      - if: github.event_name == 'pull_request' && needs.phar-build.outputs.stale == 'true'
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.phar-build.outputs.artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/phar
      - name: Retain Only A Fully Qualified Update
        if: github.event_name == 'pull_request' && needs.phar-build.outputs.stale == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: changelog-update-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/phar/changelog
          compression-level: 0
          if-no-files-found: error
      - name: Require The Refreshed Commit To Pass Before Merge
        if: github.event_name == 'pull_request' && needs.phar-build.outputs.stale == 'true'
        run: |
          echo 'The executable needs the fully qualified update; CI must pass again on the refreshed commit.' >&2
          exit 1

  coverage-report:
    name: Line Coverage Report
    needs: [impact, tests]
    if: >-
      ${{ needs.impact.outputs.runtime == 'true' && needs.tests.result == 'success' &&
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
           (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      actions: read
      pull-requests: write

    steps:
      - name: Download Native Coverage From This Workflow Run
        uses: actions/download-artifact@v8.0.2
        with:
          name: coverage-report-php
          path: .build

      - name: Compare And Summarize Line Coverage
        id: coverage
        uses: clearlyip/code-coverage-report-action@v7.0.0
        with:
          filename: .build/coverage.xml
          artifact_download_workflow_names: 'Repository: Tests'
          artifact_name: changelog-coverage-%name%
          overall_coverage_fail_threshold: '100'
          file_coverage_error_min: '100'
          file_coverage_warning_max: '100'
          only_list_changed_files: 'true'
          fail_on_negative_difference: 'true'

      - name: Update The Sticky Coverage Comment
        if: >-
          ${{ github.event_name == 'pull_request' &&
              github.event.pull_request.head.repo.full_name == github.repository &&
              github.event.pull_request.user.login != 'dependabot[bot]' &&
              steps.coverage.outputs.file != '' }}
        # Dependabot's restricted token still gets the report artifact.
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: code-coverage-overview
          number: ${{ github.event.pull_request.number }}
          path: ${{ steps.coverage.outputs.file }}
