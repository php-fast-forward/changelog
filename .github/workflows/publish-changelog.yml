name: Publish Changelog

on:
  pull_request_target:
    branches: [main]
    types: [closed]

permissions: {}

concurrency:
  group: changelog-${{ github.repository }}-main
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Changelog
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'changelog/version' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.publication.outputs.version }}
      tag: ${{ steps.publication.outputs.tag }}
      sha: ${{ steps.publication.outputs.sha }}
    steps:

      - name: Check Out The Approved Merge
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare The Base Image Cache
        uses: ./.github/actions/setup-docker

      - name: Publish The Verified Consolidation
        id: publication
        uses: ./.github/actions/publish
        with:
          working-directory: '.'
          repository: ${{ github.repository }}
          token: ${{ secrets.CHANGELOG_TOKEN || github.token }}
          base-branch: main
          managed-branch: changelog/version
          automation-actor: ${{ vars.CHANGELOG_AUTOMATION_ACTOR || 'github-actions[bot]' }}
          pull-request: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}
          target-sha: ${{ github.event.pull_request.merge_commit_sha }}

  image:
    name: Publish Docker CLI
    needs: publish
    if: needs.publish.result == 'success' && needs.publish.outputs.version != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-cli.yml
    with:
      tag: ${{ needs.publish.outputs.tag }}
      expected-sha: ${{ needs.publish.outputs.sha }}
