name: Fast Forward Changelog Dependabot
description: "Create one deterministic fragment from verified Dependabot metadata."

inputs:
  working-directory:
    description: "Consumer project directory; never the package installation root."
    required: false
    default: "."

  fragment-directory:
    description: "Project-relative pending fragment directory."
    required: false
    default: ".changelog"

  changelog-file:
    description: "Project-relative central changelog file."
    required: false
    default: "CHANGELOG.md"

  locale:
    description: "Structural language; en or pt-BR."
    required: false
    default: "en"

  template:
    description: "keep-a-changelog or an explicitly trusted project PHP template."
    required: false
    default: "keep-a-changelog"

  base-ref:
    description: "Git revision used by the shared release planner."
    required: false
    default: "HEAD"

  tag-prefix:
    description: "Prefix for stable release tags."
    required: false
    default: "v"

  repository:
    description: "GitHub owner/name of the consumer repository."
    required: false
    default: "${{ github.repository }}"

  source:
    description: "Historical source: auto, github or tags."
    required: false
    default: "auto"

  token:
    description: "GitHub token with the minimum permissions required by this operation."
    required: false
    default: "${{ github.token }}"

  pull-request:
    description: "Dependabot PR number."
    required: true

  expected-head-sha:
    description: "Immutable PR head inspected by the trusted caller."
    required: true

  dependency-names:
    description: "Comma-separated package names from verified Dependabot metadata."
    required: true

  dependency-type:
    description: "Verified direct:production, direct:development or indirect metadata."
    required: true

  ecosystem:
    description: "Verified package ecosystem."
    required: true

  security-alert-numbers:
    description: "JSON array of associated current security alert IDs supplied by a trusted collector."
    required: false
    default: "[]"

  include-dev:
    description: "Include direct development dependency updates."
    required: false
    default: "true"

  include-actions:
    description: "Include GitHub Actions dependency updates."
    required: false
    default: "true"

outputs:
  result:
    description: Complete stable JSON result.
    value: ${{ steps.run.outputs.result }}

  status:
    description: "Operation status; empty when unavailable."
    value: ${{ steps.run.outputs.status }}

  path:
    description: "Operation path; empty when unavailable."
    value: ${{ steps.run.outputs.path }}

  head-sha:
    description: "Operation head-sha; empty when unavailable."
    value: ${{ steps.run.outputs.head-sha }}

runs:
  using: composite
  steps:
    - uses: shivammathur/setup-php@2.40.0
      with:
        php-version: '8.3'
        extensions: curl, iconv, mbstring, phar, zlib
        tools: none
        coverage: none
    - id: run
      shell: bash
      env:
        FF_CHANGELOG_BINARY: ${{ github.action_path }}/../../../dist/changelog
        FF_CHANGELOG_TOKEN: ${{ inputs.token }}
        FF_INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        FF_INPUT_FRAGMENT_DIRECTORY: ${{ inputs.fragment-directory }}
        FF_INPUT_CHANGELOG_FILE: ${{ inputs.changelog-file }}
        FF_INPUT_LOCALE: ${{ inputs.locale }}
        FF_INPUT_TEMPLATE: ${{ inputs.template }}
        FF_INPUT_BASE_REF: ${{ inputs.base-ref }}
        FF_INPUT_TAG_PREFIX: ${{ inputs.tag-prefix }}
        FF_INPUT_REPOSITORY: ${{ inputs.repository }}
        FF_INPUT_SOURCE: ${{ inputs.source }}
        FF_INPUT_PULL_REQUEST: ${{ inputs.pull-request }}
        FF_INPUT_EXPECTED_HEAD_SHA: ${{ inputs.expected-head-sha }}
        FF_INPUT_DEPENDENCY_NAMES: ${{ inputs.dependency-names }}
        FF_INPUT_DEPENDENCY_TYPE: ${{ inputs.dependency-type }}
        FF_INPUT_ECOSYSTEM: ${{ inputs.ecosystem }}
        FF_INPUT_SECURITY_ALERT_NUMBERS: ${{ inputs.security-alert-numbers }}
        FF_INPUT_INCLUDE_DEV: ${{ inputs.include-dev }}
        FF_INPUT_INCLUDE_ACTIONS: ${{ inputs.include-actions }}
      run: |
        php "$FF_CHANGELOG_BINARY" \
          "github" \
          "dependabot" \
          "--no-interaction" \
          "--cwd=$FF_INPUT_WORKING_DIRECTORY" \
          "--fragment-directory=$FF_INPUT_FRAGMENT_DIRECTORY" \
          "--changelog-file=$FF_INPUT_CHANGELOG_FILE" \
          "--locale=$FF_INPUT_LOCALE" \
          "--template=$FF_INPUT_TEMPLATE" \
          "--base-ref=$FF_INPUT_BASE_REF" \
          "--tag-prefix=$FF_INPUT_TAG_PREFIX" \
          "--repository=$FF_INPUT_REPOSITORY" \
          "--source=$FF_INPUT_SOURCE" \
          "--pull-request=$FF_INPUT_PULL_REQUEST" \
          "--expected-head-sha=$FF_INPUT_EXPECTED_HEAD_SHA" \
          "--dependency-names=$FF_INPUT_DEPENDENCY_NAMES" \
          "--dependency-type=$FF_INPUT_DEPENDENCY_TYPE" \
          "--ecosystem=$FF_INPUT_ECOSYSTEM" \
          "--security-alert-numbers=$FF_INPUT_SECURITY_ALERT_NUMBERS" \
          "--include-dev=$FF_INPUT_INCLUDE_DEV" \
          "--include-actions=$FF_INPUT_INCLUDE_ACTIONS"
