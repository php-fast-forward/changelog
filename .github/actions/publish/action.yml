name: Fast Forward Changelog publish
description: "Reconcile an immutable tag and GitHub Release from approved Git blobs."
inputs:
  working-directory:
    description: "Consumer project directory; never the package installation root."
    required: false
    default: "."
  fragment-directory:
    description: "Project-relative pending fragment directory."
    required: false
    default: ".changelog"
  changelog-file:
    description: "Project-relative central changelog file."
    required: false
    default: "CHANGELOG.md"
  locale:
    description: "Structural language; en or pt-BR."
    required: false
    default: "en"
  template:
    description: "keep-a-changelog or an explicitly trusted project PHP template."
    required: false
    default: "keep-a-changelog"
  base-ref:
    description: "Git revision used by the shared release planner."
    required: false
    default: "HEAD"
  tag-prefix:
    description: "Prefix for stable release tags."
    required: false
    default: "v"
  repository:
    description: "GitHub owner/name of the consumer repository."
    required: false
    default: "${{ github.repository }}"
  source:
    description: "Historical source: auto, github or tags."
    required: false
    default: "auto"
  token:
    description: "GitHub token with the minimum permissions required by this operation."
    required: false
    default: "${{ github.token }}"
  target-sha:
    description: "Full approved merge or manually approved commit SHA."
    required: true
  pull-request:
    description: "Merged version PR number; enables additional signed ownership proof."
    required: false
    default: ""
  expected-head-sha:
    description: "Original immutable version PR head; required with pull-request."
    required: false
    default: ""
  base-branch:
    description: "Configured release-line branch."
    required: false
    default: "main"
  managed-branch:
    description: "Exclusive managed version PR branch."
    required: false
    default: "changelog/version"
  automation-actor:
    description: "Expected signed automation Bot."
    required: false
    default: "github-actions[bot]"
  dry-run:
    description: "Verify and preview without remote writes."
    required: false
    default: "false"
outputs:
  result:
    description: Complete stable JSON result.
  state:
    description: "Operation state; empty when unavailable."
  version:
    description: "Operation version; empty when unavailable."
  tag:
    description: "Operation tag; empty when unavailable."
  sha:
    description: "Operation sha; empty when unavailable."
  url:
    description: "Operation url; empty when unavailable."
runs:
  using: docker
  image: "../../../Dockerfile"
  env:
    FF_CHANGELOG_TOKEN: ${{ inputs.token }}
  args:
    - "github"
    - "publish"
    - "--no-interaction"
    - "--cwd=${{ inputs.working-directory }}"
    - "--fragment-directory=${{ inputs.fragment-directory }}"
    - "--changelog-file=${{ inputs.changelog-file }}"
    - "--locale=${{ inputs.locale }}"
    - "--template=${{ inputs.template }}"
    - "--base-ref=${{ inputs.base-ref }}"
    - "--tag-prefix=${{ inputs.tag-prefix }}"
    - "--repository=${{ inputs.repository }}"
    - "--source=${{ inputs.source }}"
    - "--target-sha=${{ inputs.target-sha }}"
    - "--pull-request=${{ inputs.pull-request }}"
    - "--expected-head-sha=${{ inputs.expected-head-sha }}"
    - "--base-branch=${{ inputs.base-branch }}"
    - "--managed-branch=${{ inputs.managed-branch }}"
    - "--automation-actor=${{ inputs.automation-actor }}"
    - "--dry-run=${{ inputs.dry-run }}"
