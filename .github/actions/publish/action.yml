name: Fast Forward Changelog Publish
description: "Reconcile an immutable tag and GitHub Release from approved Git blobs."

inputs:
  working-directory:
    description: "Consumer project directory; never the package installation root."
    required: false
    default: "."

  fragment-directory:
    description: "Project-relative pending fragment directory."
    required: false
    default: ".changelog"

  changelog-file:
    description: "Project-relative central changelog file."
    required: false
    default: "CHANGELOG.md"

  locale:
    description: "Structural language; en or pt-BR."
    required: false
    default: "en"

  template:
    description: "keep-a-changelog or an explicitly trusted project PHP template."
    required: false
    default: "keep-a-changelog"

  base-ref:
    description: "Git revision used by the shared release planner."
    required: false
    default: "HEAD"

  tag-prefix:
    description: "Prefix for stable release tags."
    required: false
    default: "v"

  repository:
    description: "GitHub owner/name of the consumer repository."
    required: false
    default: "${{ github.repository }}"

  source:
    description: "Historical source: auto, github or tags."
    required: false
    default: "auto"

  generated-files:
    description: 'JSON array of existing tracked file paths allowed as generated release outputs.'
    required: false
    default: '[]'

  resolve-pull-requests:
    description: "Recompute verified fragment PR references before comparing approved release notes."
    required: false
    default: "true"

  token:
    description: "GitHub token with the minimum permissions required by this operation."
    required: false
    default: "${{ github.token }}"

  target-sha:
    description: "Full approved merge or manually approved commit SHA."
    required: true

  pull-request:
    description: "Merged version PR number; enables additional signed ownership proof."
    required: false
    default: ""

  expected-head-sha:
    description: "Original immutable version PR head; required with pull-request."
    required: false
    default: ""

  base-branch:
    description: "Configured release-line branch."
    required: false
    default: "main"

  managed-branch:
    description: "Exclusive managed version PR branch."
    required: false
    default: "changelog/version"

  automation-actor:
    description: "Expected signed automation Bot."
    required: false
    default: "github-actions[bot]"

  dry-run:
    description: "Verify and preview without remote writes."
    required: false
    default: "false"

outputs:
  result:
    description: Complete stable JSON result.
    value: ${{ steps.run.outputs.result }}

  state:
    description: "Operation state; empty when unavailable."
    value: ${{ steps.run.outputs.state }}

  version:
    description: "Operation version; empty when unavailable."
    value: ${{ steps.run.outputs.version }}

  tag:
    description: "Operation tag; empty when unavailable."
    value: ${{ steps.run.outputs.tag }}

  sha:
    description: "Operation sha; empty when unavailable."
    value: ${{ steps.run.outputs.sha }}

  url:
    description: "Operation url; empty when unavailable."
    value: ${{ steps.run.outputs.url }}

runs:
  using: composite
  steps:
    - uses: shivammathur/setup-php@2.40.0
      with:
        php-version: '8.3'
        extensions: curl, iconv, mbstring, phar, zlib
        tools: none
        coverage: none
    - id: run
      shell: bash
      env:
        FF_CHANGELOG_BINARY: ${{ github.action_path }}/../../../dist/changelog
        FF_CHANGELOG_TOKEN: ${{ inputs.token }}
        FF_INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        FF_INPUT_FRAGMENT_DIRECTORY: ${{ inputs.fragment-directory }}
        FF_INPUT_CHANGELOG_FILE: ${{ inputs.changelog-file }}
        FF_INPUT_LOCALE: ${{ inputs.locale }}
        FF_INPUT_TEMPLATE: ${{ inputs.template }}
        FF_INPUT_BASE_REF: ${{ inputs.base-ref }}
        FF_INPUT_TAG_PREFIX: ${{ inputs.tag-prefix }}
        FF_INPUT_REPOSITORY: ${{ inputs.repository }}
        FF_INPUT_SOURCE: ${{ inputs.source }}
        FF_INPUT_GENERATED_FILES: ${{ inputs.generated-files }}
        FF_INPUT_RESOLVE_PULL_REQUESTS: ${{ inputs.resolve-pull-requests }}
        FF_INPUT_TARGET_SHA: ${{ inputs.target-sha }}
        FF_INPUT_PULL_REQUEST: ${{ inputs.pull-request }}
        FF_INPUT_EXPECTED_HEAD_SHA: ${{ inputs.expected-head-sha }}
        FF_INPUT_BASE_BRANCH: ${{ inputs.base-branch }}
        FF_INPUT_MANAGED_BRANCH: ${{ inputs.managed-branch }}
        FF_INPUT_AUTOMATION_ACTOR: ${{ inputs.automation-actor }}
        FF_INPUT_DRY_RUN: ${{ inputs.dry-run }}
      run: |
        php "$FF_CHANGELOG_BINARY" \
          "github" \
          "publish" \
          "--no-interaction" \
          "--cwd=$FF_INPUT_WORKING_DIRECTORY" \
          "--fragment-directory=$FF_INPUT_FRAGMENT_DIRECTORY" \
          "--changelog-file=$FF_INPUT_CHANGELOG_FILE" \
          "--locale=$FF_INPUT_LOCALE" \
          "--template=$FF_INPUT_TEMPLATE" \
          "--base-ref=$FF_INPUT_BASE_REF" \
          "--tag-prefix=$FF_INPUT_TAG_PREFIX" \
          "--repository=$FF_INPUT_REPOSITORY" \
          "--source=$FF_INPUT_SOURCE" \
          "--generated-files=$FF_INPUT_GENERATED_FILES" \
          "--resolve-pull-requests=$FF_INPUT_RESOLVE_PULL_REQUESTS" \
          "--target-sha=$FF_INPUT_TARGET_SHA" \
          "--pull-request=$FF_INPUT_PULL_REQUEST" \
          "--expected-head-sha=$FF_INPUT_EXPECTED_HEAD_SHA" \
          "--base-branch=$FF_INPUT_BASE_BRANCH" \
          "--managed-branch=$FF_INPUT_MANAGED_BRANCH" \
          "--automation-actor=$FF_INPUT_AUTOMATION_ACTOR" \
          "--dry-run=$FF_INPUT_DRY_RUN"
