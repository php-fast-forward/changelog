name: Fast Forward Changelog Check
description: "Validate PR fragments and verified waiver/history authority."

inputs:
  working-directory:
    description: "Consumer project directory; never the package installation root."
    required: false
    default: "."

  fragment-directory:
    description: "Project-relative pending fragment directory."
    required: false
    default: ".changelog"

  changelog-file:
    description: "Project-relative central changelog file."
    required: false
    default: "CHANGELOG.md"

  locale:
    description: "Structural language; en or pt-BR."
    required: false
    default: "en"

  template:
    description: "keep-a-changelog or an explicitly trusted project PHP template."
    required: false
    default: "keep-a-changelog"

  base-ref:
    description: "Git revision used by the shared release planner."
    required: false
    default: "HEAD"

  tag-prefix:
    description: "Prefix for stable release tags."
    required: false
    default: "v"

  repository:
    description: "GitHub owner/name of the consumer repository."
    required: false
    default: "${{ github.repository }}"

  source:
    description: "Historical source: auto, github or tags."
    required: false
    default: "auto"

  generated-files:
    description: 'JSON array of existing tracked file paths allowed as generated release outputs.'
    required: false
    default: '[]'

  resolve-pull-requests:
    description: "PR-resolution setting of the approved version transaction; checking performs no origin lookup."
    required: false
    default: "true"

  token:
    description: "GitHub token with the minimum permissions required by this operation."
    required: false
    default: "${{ github.token }}"

  since:
    description: "Immutable contribution baseline."
    required: true

  pull-request:
    description: "PR number for GitHub-backed exception authority."
    required: false
    default: ""

  managed-branch:
    description: "Managed version branch."
    required: false
    default: "changelog/version"

  automation-actor:
    description: "Expected authenticated automation Bot."
    required: false
    default: "github-actions[bot]"

  waiver-label:
    description: "Maintainer-authorized contribution waiver label."
    required: false
    default: "changelog-not-required"

  maintenance-label:
    description: "Maintainer-authorized central-history maintenance label."
    required: false
    default: "changelog-maintenance"

outputs:
  result:
    description: Complete stable JSON result.
    value: ${{ steps.run.outputs.result }}

  status:
    description: "Operation status; empty when unavailable."
    value: ${{ steps.run.outputs.status }}

  fragments:
    description: "Operation fragments; empty when unavailable."
    value: ${{ steps.run.outputs.fragments }}

runs:
  using: composite
  steps:
    - uses: shivammathur/setup-php@2.40.0
      with:
        php-version: '8.3'
        extensions: curl, iconv, mbstring, phar, zlib
        tools: none
        coverage: none
    - id: run
      shell: bash
      env:
        FF_CHANGELOG_BINARY: ${{ github.action_path }}/../../../dist/changelog
        FF_CHANGELOG_TOKEN: ${{ inputs.token }}
        FF_INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        FF_INPUT_FRAGMENT_DIRECTORY: ${{ inputs.fragment-directory }}
        FF_INPUT_CHANGELOG_FILE: ${{ inputs.changelog-file }}
        FF_INPUT_LOCALE: ${{ inputs.locale }}
        FF_INPUT_TEMPLATE: ${{ inputs.template }}
        FF_INPUT_BASE_REF: ${{ inputs.base-ref }}
        FF_INPUT_TAG_PREFIX: ${{ inputs.tag-prefix }}
        FF_INPUT_REPOSITORY: ${{ inputs.repository }}
        FF_INPUT_SOURCE: ${{ inputs.source }}
        FF_INPUT_GENERATED_FILES: ${{ inputs.generated-files }}
        FF_INPUT_RESOLVE_PULL_REQUESTS: ${{ inputs.resolve-pull-requests }}
        FF_INPUT_SINCE: ${{ inputs.since }}
        FF_INPUT_PULL_REQUEST: ${{ inputs.pull-request }}
        FF_INPUT_MANAGED_BRANCH: ${{ inputs.managed-branch }}
        FF_INPUT_AUTOMATION_ACTOR: ${{ inputs.automation-actor }}
        FF_INPUT_WAIVER_LABEL: ${{ inputs.waiver-label }}
        FF_INPUT_MAINTENANCE_LABEL: ${{ inputs.maintenance-label }}
      run: |
        php "$FF_CHANGELOG_BINARY" \
          "github" \
          "check" \
          "--no-interaction" \
          "--cwd=$FF_INPUT_WORKING_DIRECTORY" \
          "--fragment-directory=$FF_INPUT_FRAGMENT_DIRECTORY" \
          "--changelog-file=$FF_INPUT_CHANGELOG_FILE" \
          "--locale=$FF_INPUT_LOCALE" \
          "--template=$FF_INPUT_TEMPLATE" \
          "--base-ref=$FF_INPUT_BASE_REF" \
          "--tag-prefix=$FF_INPUT_TAG_PREFIX" \
          "--repository=$FF_INPUT_REPOSITORY" \
          "--source=$FF_INPUT_SOURCE" \
          "--generated-files=$FF_INPUT_GENERATED_FILES" \
          "--resolve-pull-requests=$FF_INPUT_RESOLVE_PULL_REQUESTS" \
          "--since=$FF_INPUT_SINCE" \
          "--pull-request=$FF_INPUT_PULL_REQUEST" \
          "--managed-branch=$FF_INPUT_MANAGED_BRANCH" \
          "--automation-actor=$FF_INPUT_AUTOMATION_ACTOR" \
          "--waiver-label=$FF_INPUT_WAIVER_LABEL" \
          "--maintenance-label=$FF_INPUT_MAINTENANCE_LABEL"
