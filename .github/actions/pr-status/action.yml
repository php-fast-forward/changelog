name: Fast Forward Changelog PR Status
description: Validate an exact PR snapshot, render feedback and optionally publish its commit status.

inputs:
  working-directory:
    description: Repository root below the mounted workspace.
    default: '.'
  repository:
    description: Consumer owner/name.
    default: ${{ github.repository }}
  token:
    description: Token with read permissions and statuses write when publishing a status.
    default: ${{ github.token }}
  pull-request:
    description: Open pull-request number.
    required: true
  head-sha:
    description: Exact checked-out PR head.
    value: ${{ steps.run.outputs.head-sha }}
    required: true
  base-sha:
    description: Exact live PR base.
    required: true
  base-branch:
    description: Maintained release line.
    default: ${{ github.event.repository.default_branch }}
  fragment-directory:
    description: Repository-relative pending fragments.
    default: '.changelog'
  changelog-file:
    description: Repository-relative consolidated history.
    default: 'CHANGELOG.md'
  locale:
    description: Structural presentation locale.
    default: 'en'
  tag-prefix:
    description: Stable tag prefix, matching version and publication.
    default: 'v'
  source:
    description: Historical source setting, matching the approved transaction.
    default: 'auto'
  generated-files:
    description: 'JSON array of existing tracked file paths allowed as generated release outputs.'
    required: false
    default: '[]'

  resolve-pull-requests:
    description: PR-resolution setting for ownership checks; no fragment origin lookup occurs.
    default: 'true'
  managed-branch:
    description: Exclusive generated version branch.
    default: 'changelog/version'
  automation-actor:
    description: Trusted generated-commit Bot.
    default: 'github-actions[bot]'
  waiver-label:
    description: Maintainer-authorized contribution waiver label.
    default: 'changelog-not-required'
  maintenance-label:
    description: Maintainer-authorized history maintenance label.
    default: 'changelog-maintenance'
  publish-status:
    description: Publish the exact head commit status, true or false.
    default: 'false'

outputs:
  result:
    description: JSON containing snapshot identities and diagnostics; obsolete results omit comment_body and errors.
    value: ${{ steps.run.outputs.result }}
  status:
    description: valid, invalid or obsolete; unavailable evidence fails without claiming validation.
    value: ${{ steps.run.outputs.status }}
  head-sha:
    description: Inspected immutable PR head.
    value: ${{ steps.run.outputs.head-sha }}

runs:
  using: composite
  steps:
    - uses: shivammathur/setup-php@2.40.0
      with:
        php-version: '8.3'
        extensions: curl, iconv, mbstring, phar, zlib
        tools: none
        coverage: none
    - id: run
      shell: bash
      env:
        FF_CHANGELOG_BINARY: ${{ github.action_path }}/../../../dist/changelog
        FF_CHANGELOG_TOKEN: ${{ inputs.token }}
        FF_INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        FF_INPUT_REPOSITORY: ${{ inputs.repository }}
        FF_INPUT_SOURCE: ${{ inputs.source }}
        FF_INPUT_GENERATED_FILES: ${{ inputs.generated-files }}
        FF_INPUT_RESOLVE_PULL_REQUESTS: ${{ inputs.resolve-pull-requests }}
        FF_INPUT_LOCALE: ${{ inputs.locale }}
        FF_INPUT_TAG_PREFIX: ${{ inputs.tag-prefix }}
        FF_INPUT_PULL_REQUEST: ${{ inputs.pull-request }}
        FF_INPUT_HEAD_SHA: ${{ inputs.head-sha }}
        FF_INPUT_BASE_SHA: ${{ inputs.base-sha }}
        FF_INPUT_BASE_BRANCH: ${{ inputs.base-branch }}
        FF_INPUT_FRAGMENT_DIRECTORY: ${{ inputs.fragment-directory }}
        FF_INPUT_CHANGELOG_FILE: ${{ inputs.changelog-file }}
        FF_INPUT_MANAGED_BRANCH: ${{ inputs.managed-branch }}
        FF_INPUT_AUTOMATION_ACTOR: ${{ inputs.automation-actor }}
        FF_INPUT_WAIVER_LABEL: ${{ inputs.waiver-label }}
        FF_INPUT_MAINTENANCE_LABEL: ${{ inputs.maintenance-label }}
        FF_INPUT_PUBLISH_STATUS: ${{ inputs.publish-status }}
      run: |
        php "$FF_CHANGELOG_BINARY" \
          "github" \
          "pr-status" \
          "--no-interaction" \
          "--cwd=$FF_INPUT_WORKING_DIRECTORY" \
          "--repository=$FF_INPUT_REPOSITORY" \
          "--source=$FF_INPUT_SOURCE" \
          "--generated-files=$FF_INPUT_GENERATED_FILES" \
          "--resolve-pull-requests=$FF_INPUT_RESOLVE_PULL_REQUESTS" \
          "--locale=$FF_INPUT_LOCALE" \
          "--tag-prefix=$FF_INPUT_TAG_PREFIX" \
          "--pull-request=$FF_INPUT_PULL_REQUEST" \
          "--expected-head-sha=$FF_INPUT_HEAD_SHA" \
          "--since=$FF_INPUT_BASE_SHA" \
          "--base-branch=$FF_INPUT_BASE_BRANCH" \
          "--fragment-directory=$FF_INPUT_FRAGMENT_DIRECTORY" \
          "--changelog-file=$FF_INPUT_CHANGELOG_FILE" \
          "--managed-branch=$FF_INPUT_MANAGED_BRANCH" \
          "--automation-actor=$FF_INPUT_AUTOMATION_ACTOR" \
          "--waiver-label=$FF_INPUT_WAIVER_LABEL" \
          "--maintenance-label=$FF_INPUT_MAINTENANCE_LABEL" \
          "--publish-status=$FF_INPUT_PUBLISH_STATUS"
