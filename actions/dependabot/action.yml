name: Fast Forward Changelog dependabot
description: "Create one deterministic fragment from verified Dependabot metadata."
inputs:
  working-directory:
    description: "Consumer project directory; never the package installation root."
    required: false
    default: "."
  fragment-directory:
    description: "Project-relative pending fragment directory."
    required: false
    default: ".changelog"
  changelog-file:
    description: "Project-relative central changelog file."
    required: false
    default: "CHANGELOG.md"
  locale:
    description: "Structural language; en or pt-BR."
    required: false
    default: "en"
  template:
    description: "keep-a-changelog or an explicitly trusted project PHP template."
    required: false
    default: "keep-a-changelog"
  base-ref:
    description: "Git revision used by the shared release planner."
    required: false
    default: "HEAD"
  tag-prefix:
    description: "Prefix for stable release tags."
    required: false
    default: "v"
  repository:
    description: "GitHub owner/name of the consumer repository."
    required: false
    default: "${{ github.repository }}"
  source:
    description: "Historical source: auto, github or tags."
    required: false
    default: "auto"
  token:
    description: "GitHub token with the minimum permissions required by this operation."
    required: false
    default: "${{ github.token }}"
  pull-request:
    description: "Dependabot PR number."
    required: true
  expected-head-sha:
    description: "Immutable PR head inspected by the trusted caller."
    required: true
  dependency-names:
    description: "Comma-separated package names from verified Dependabot metadata."
    required: true
  dependency-type:
    description: "Verified direct:production, direct:development or indirect metadata."
    required: true
  ecosystem:
    description: "Verified package ecosystem."
    required: true
  security-alert-numbers:
    description: "JSON array of associated current security alert IDs supplied by a trusted collector."
    required: false
    default: "[]"
  include-dev:
    description: "Include direct development dependency updates."
    required: false
    default: "true"
  include-actions:
    description: "Include GitHub Actions dependency updates."
    required: false
    default: "true"
outputs:
  result:
    description: Complete stable JSON result.
    value: ${{ steps.operation.outputs.result }}
  status:
    description: "Operation status; empty when unavailable."
    value: ${{ steps.operation.outputs.status }}
  path:
    description: "Operation path; empty when unavailable."
    value: ${{ steps.operation.outputs.path }}
  head-sha:
    description: "Operation head-sha; empty when unavailable."
    value: ${{ steps.operation.outputs.head-sha }}
runs:
  using: composite
  steps:
    - name: Set up package runtime
      # setup-php 2.36.0
      uses: shivammathur/setup-php@db91e1a0e48e84637d325a7ee4d2677e146ceec4
      with:
        php-version: '8.5'
        coverage: none
        tools: composer:v2
    - name: Install only the trusted Action package
      shell: bash
      env:
        FF_RUNTIME_ROOT: ${{ github.action_path }}/../..
      run: |
        env -u GITHUB_TOKEN -u GH_TOKEN -u FF_CHANGELOG_INPUTS composer install --working-dir="$FF_RUNTIME_ROOT" --no-dev --no-plugins --no-scripts --prefer-dist --no-interaction --no-progress
    - name: Run shared Changelog service
      id: operation
      shell: bash
      env:
        FF_RUNTIME_ROOT: ${{ github.action_path }}/../..
        FF_CHANGELOG_INPUTS: ${{ toJSON(inputs) }}
      run: php "$FF_RUNTIME_ROOT/scripts/automation.php" dependabot
